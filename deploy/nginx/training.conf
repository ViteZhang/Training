# training.dreamelab.cn：App 调 /api/v1/，后台接口 /api/v1/admin/，后台网页 /admin/。

# 访问日志不记查询参数（可能含手机号），只记路径
log_format training '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent"';
server {
  listen 80;
  server_name training.dreamelab.cn;
  location /.well-known/acme-challenge/ { root /usr/share/nginx/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name training.dreamelab.cn;

  ssl_certificate     /etc/nginx/certs/training.dreamelab.cn.pem;
  ssl_certificate_key /etc/nginx/certs/training.dreamelab.cn.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  server_tokens off;

  access_log /var/log/nginx/access.log training;

  # 文件由客户端直传 OSS，API 只收 JSON；粘贴文字 2 万字以内，2 MB 足够
  client_max_body_size 2m;

  # api 容器重建后 IP 会变：用 Docker 内置 DNS 动态解析，避免 Nginx 缓存旧地址返回 502
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s; # 单题批改 ≤ 8 秒、AI 解读 ≤ 5 秒，留足余量
  }

  location = /admin { return 301 /admin/; }
  location /admin/ {
    alias /usr/share/nginx/admin/;
    try_files $uri $uri/ /admin/index.html;
    add_header X-Robots-Tag "noindex" always;
    location ~* \.(js|css|woff2?|png|svg)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  }

  location = / { return 404; }
}
