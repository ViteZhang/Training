# 应用服务：api、worker、asynqmon。
# ECS 已有 dreamer-nginx、dreamer-mysql、dreamer-redis，本文件不再重复启动网关或数据库。
# 在 /opt/training 下运行：docker compose -f docker-compose.app.yml --env-file .env up -d
# .env 由 runbook 第 4 步创建，包含 IMAGE、VERSION 与全部应用环境变量（不进仓库）。
name: training

x-app: &app
  image: ${IMAGE:?需要在 .env 里设置 IMAGE}:${VERSION:?需要设置 VERSION}
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }
  networks:
    - dreamer-net

services:
  api:
    <<: *app
    command: ["/app/api"]
    expose: ["8080"]
    container_name: training-api
    networks:
      dreamer-net:
        aliases: [training-api]
    stop_grace_period: 40s # 大于 SHUTDOWN_TIMEOUT（30s），让进行中的请求做完

  worker:
    <<: *app
    command: ["/app/worker"]
    stop_grace_period: 40s
    container_name: training-worker
    # 调度器全局只能有一个实例：worker 只部署一个，不要 scale。
    deploy:
      replicas: 1

  asynqmon:
    image: ${ASYNQMON_IMAGE:-hibiken/asynqmon:latest}
    restart: unless-stopped
    command: ["--redis-addr=${REDIS_ADDR}", "--redis-password=${REDIS_PASSWORD}", "--redis-db=${REDIS_DB:-0}"]
    container_name: training-asynqmon
    # 只绑定应用机回环地址，通过 SSH 隧道访问，不对公网开放。
    ports: ["127.0.0.1:8081:8080"]
    networks:
      - dreamer-net

networks:
  dreamer-net:
    external: true
    name: dreamer-net
