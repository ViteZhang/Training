<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.1 你考哪门专业课</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
input::placeholder{color:#9A9A96}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 44px 22px 0; box-sizing: border-box; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<div style="flex-grow: 1; display: flex; gap: 6px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span></div>
<span style="font-family: 'DM Sans',sans-serif; font-size: 13px; color: #6E6E6E">1 / 5</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">你考哪门专业课？</h1><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">导入的资料会按专业课整理。目前支持以名词解释、简答、论述为主的文科专业课。</p></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 500">参加哪一年的考试</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F7F7F5; border-radius: 14px">
<sc-for list="{{years}}" as="y" hint-placeholder-count="2"><button onClick="{{y.pick}}" aria-pressed="{{y.sel}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; height: 52px; border: none; border-radius: 10px; background: {{y.bg}}; font-family: inherit; color: #1A1A1A"><span style="font-size: 14px; font-weight: {{y.weight}}">{{y.label}}</span><span style="font-size: 11px; color: #6E6E6E">{{y.sub}}</span></button></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 500">专业课</span><span style="font-size: 12px; color: #767676">最多 4 门</span></div>
<div style="border-radius: 22px; border: 1px solid #EFEFEF; overflow: hidden">
<sc-for list="{{subjects}}" as="s" hint-placeholder-count="2"><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px 0 18px; border-bottom: 1px solid #EFEFEF">
<span style="min-width: 36px; font-family: 'DM Sans',sans-serif; font-size: 15px; font-weight: 600">{{s.code}}</span>
<span style="flex-grow: 1; font-size: 15px">{{s.name}}</span>
<button onClick="{{s.remove}}" aria-label="删除这门专业课" style="width: 44px; height: 44px; border: none; background: transparent; color: #767676; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div></sc-for>
<label style="display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 8px 0 18px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">添加专业课</span>
<input type="text" placeholder="代码 + 名称，如 654 语言文学基础" value="{{draft}}" onChange="{{onDraft}}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #1A1A1A">
<button onClick="{{add}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{addBg}}; color: {{addInk}}; font-family: inherit; font-size: 13px; flex-shrink: 0">添加</button>
</label>
</div>
<span style="font-size: 12px; color: #767676">不知道代码？只写名称也可以，比如「中国古代文学史」</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 500">目标院校专业 <span style="font-weight: 400; color: #767676">选填</span></span>
<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px 0 18px; border-radius: 18px; background: #F7F7F5; border: none; font-family: inherit; text-align: left; color: #1A1A1A">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">未填写</span><span style="font-size: 12px; color: #6E6E6E">以后收录了你的院校专业，会给你推送官方题库</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>
</main>
<div style="padding: 12px 22px 34px; flex-shrink: 0">
<sc-if value="{{canNext}}" hint-placeholder-val="{{ true }}"><a href="m1_target.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">下一步</a></sc-if>
<sc-if value="{{noNext}}" hint-placeholder-val="{{ false }}"><button disabled="" style="width: 100%; height: 50px; border-radius: 25px; border: none; background: #EFEFEF; color: #9E9E9E; font-family: inherit; font-size: 15px; font-weight: 500">至少添加一门专业课</button></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const list = s.subjects || [{ code: '654', name: '语言文学基础' }, { code: '908', name: '作文' }];
    const year = s.year || '2027';
    const draft = s.draft || '';
    const add = () => {
      const t = draft.trim();
      if (!t || list.length >= 4) return;
      const m = /^(\d{3})\s*(.+)$/.exec(t);
      const item = m ? { code: m[1], name: m[2].trim() } : { code: '', name: t };
      this.setState({ subjects: list.concat([item]), draft: '' });
    };
    return {
      subjects: list.map((it, i) => ({
        code: it.code || '—',
        name: it.name,
        remove: () => this.setState({ subjects: list.filter((_, j) => j !== i) })
      })),
      years: [
        { id: '2027', label: '2027 研考', sub: '今年 12 月初试' },
        { id: '2028', label: '2028 研考', sub: '明年 12 月初试' }
      ].map((y) => ({
        label: y.label,
        sub: y.sub,
        sel: y.id === year ? 'true' : 'false',
        bg: y.id === year ? '#FFFFFF' : 'transparent',
        weight: y.id === year ? '700' : '400',
        pick: () => this.setState({ year: y.id })
      })),
      draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      add,
      addBg: draft.trim() ? '#1A1A1A' : '#EFEFEF',
      addInk: draft.trim() ? '#FFFFFF' : '#9E9E9E',
      canNext: list.length > 0,
      noNext: list.length === 0
    };
  }
}
</script>
</body>
</html>
