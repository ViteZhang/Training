<p style="margin: 0; font-size: 15px; line-height: 1.9; text-indent: 2em">清晨的菜市场里，卖豆腐的老人总是最后一个收摊。他说豆子要泡足一夜，磨浆要守着火候，快不得。<span style="border-bottom: 2px solid #E3C25A">我忽然明白，慢不是落后，而是对事物本身的尊重。</span></p>
<div style="padding: 10px 12px; border-radius: 14px; background: #FBF3D9; color: #6B5207; font-size: 12px; line-height: 1.6">立意句：第一段末尾用一句话亮出观点，把「慢」从速度问题转为态度问题。</div>
<p style="margin: 0; font-size: 15px; line-height: 1.9; text-indent: 2em">这个时代崇拜效率。外卖要准时，消息要秒回，连读书也被压缩成十分钟的解读音频。我们得到了更多，却很少真正拥有什么。</p>
<div style="padding: 10px 12px; border-radius: 14px; background: #FBF3D9; color: #6B5207; font-size: 12px; line-height: 1.6">分论点一：先写「快」的代价，为后文转折蓄力；例子贴近当代生活。</div>
