<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.2 设定目标分</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 44px 22px 0; box-sizing: border-box; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<a href="m1_subject.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: #1A1A1A; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; display: flex; gap: 6px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span></div>
<span style="font-family: 'DM Sans',sans-serif; font-size: 13px; color: #6E6E6E">2 / 5</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">给自己定个目标分</h1><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">每门专业课一个目标，首页会用它和预估分比，告诉你还差多少。之后在首页点目标分就能改。</p></div>
<sc-for list="{{subjects}}" as="s" hint-placeholder-count="2"><section style="display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; border-radius: 22px; border: 1px solid #EFEFEF">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 700"><span style="font-family: 'DM Sans',sans-serif">{{s.code}}</span> {{s.name}}</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #6E6E6E">满分<sc-for list="{{s.fulls}}" as="f" hint-placeholder-count="3"><button onClick="{{f.pick}}" aria-pressed="{{f.sel}}" style="min-width: 40px; height: 28px; padding: 0 8px; border-radius: 14px; border: none; background: {{f.bg}}; color: {{f.ink}}; font-family: 'DM Sans',sans-serif; font-size: 12px; font-weight: 600">{{f.n}}</button></sc-for></span></div>
<sc-if value="{{s.isSet}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button onClick="{{s.dec}}" aria-label="目标分减 1" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F7F7F5; color: #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'DM Sans',sans-serif; font-size: 40px; font-weight: 600; letter-spacing: -1.5px; line-height: 1">{{s.target}}</span><span style="font-family: 'DM Sans',sans-serif; font-size: 14px; color: #6E6E6E">/ {{s.full}}</span></span>
<button onClick="{{s.inc}}" aria-label="目标分加 1" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F7F7F5; color: #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="position: relative; height: 22px"><div style="position: absolute; left: 0; right: 0; top: 8px; height: 6px; border-radius: 3px; background: #EFEFEF"></div><div style="position: absolute; left: {{s.pct}}; top: 2px; width: 2px; height: 18px; background: #F2956B"></div></div>
<button onClick="{{s.clear}}" style="align-self: center; min-height: 32px; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 12px; color: #6E6E6E">先不设这门</button>
</div></sc-if>
<sc-if value="{{s.notSet}}" hint-placeholder-val="{{ false }}"><button onClick="{{s.start}}" style="height: 44px; border-radius: 22px; border: 1px dashed #D6D6D6; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #1A1A1A">设个目标分</button></sc-if>
</section></sc-for>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #F7F7F5; margin-bottom: 12px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #F2956B; flex-shrink: 0"></span>
<span style="font-size: 12px; line-height: 1.65; color: #6E6E6E">不知道定多少？可以参考目标院校往年的复试线，和上岸学长学姐的专业课成绩</span>
</div>
</main>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 22px 26px; flex-shrink: 0">
<a href="m1_setup.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">下一步</a>
<a href="m1_setup.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 14px; color: #6E6E6E; text-decoration: none">先跳过</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const list = s.list || [
      { code: '654', name: '语言文学基础', full: 150, target: 115 },
      { code: '908', name: '作文', full: 150, target: null }
    ];
    const put = (i, patch) => this.setState({ list: list.map((x, j) => (j === i ? Object.assign({}, x, patch) : x)) });
    return {
      subjects: list.map((x, i) => {
        const set = x.target !== null && x.target !== undefined;
        const t = set ? Math.min(x.target, x.full) : 0;
        return {
          code: x.code, name: x.name, full: x.full, target: t,
          isSet: set, notSet: !set,
          pct: (set ? (t / x.full) * 100 : 0).toFixed(1) + '%',
          dec: () => put(i, { target: Math.max(0, t - 1) }),
          inc: () => put(i, { target: Math.min(x.full, t + 1) }),
          clear: () => put(i, { target: null }),
          start: () => put(i, { target: Math.round(x.full * 0.7) }),
          fulls: [100, 150, 300].map((n) => ({
            n,
            sel: n === x.full ? 'true' : 'false',
            bg: n === x.full ? '#1A1A1A' : '#F7F7F5',
            ink: n === x.full ? '#FFFFFF' : '#1A1A1A',
            pick: () => put(i, { full: n, target: set ? Math.min(t, n) : null })
          }))
        };
      })
    };
  }
}
</script>
</body>
</html>
