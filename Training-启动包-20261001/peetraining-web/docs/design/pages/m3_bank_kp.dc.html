<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const s = st.subject || 'a';
    const f = st.filter || 'all';
    return {
      isA: s === 'a',
      isB: s === 'b',
      subjects: [{ id: 'a', label: '654 语言文学基础' }, { id: 'b', label: '908 作文' }].map((x) => ({
        label: x.label,
        sel: x.id === s ? 'true' : 'false',
        bg: x.id === s ? '#FFFFFF' : 'transparent',
        weight: x.id === s ? '700' : '400',
        pick: () => this.setState({ subject: x.id })
      })),
      filters: [{ id: 'all', label: '全部' }, { id: 'weak', label: '未掌握' }, { id: 'exam', label: '真题考过' }, { id: 'check', label: '待核对' }].map((x) => ({
        label: x.label,
        sel: x.id === f ? 'true' : 'false',
        bg: x.id === f ? '#1A1A1A' : '#F7F7F5',
        ink: x.id === f ? '#FFFFFF' : '#1A1A1A',
        pick: () => this.setState({ filter: x.id })
      }))
    };
  }
}
