<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>6.5 会员中心</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 44px 22px 24px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px"><a href="m6_me.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: #1A1A1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size: 15px; font-weight: 500">开通会员</span><span style="width: 44px"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">备考期间，批改不限次</h1></div>
<section style="border-radius: 20px; border: 1px solid #EFEFEF; overflow: hidden">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px; align-items: center; min-height: 38px; padding: 0 14px; background: #F7F7F5; font-size: 12px; color: #6E6E6E"><span>权益</span><span style="text-align: center">免费版</span><span style="text-align: center; color: #1A1A1A; font-weight: 700">会员</span></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px; align-items: center; min-height: 40px; padding: 0 14px; font-size: 13px"><span>主观题批改</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; color: #6E6E6E">3 次/天</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; font-weight: 700">不限</span></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px; align-items: center; min-height: 40px; padding: 0 14px; border-top: 1px solid #EFEFEF; font-size: 13px"><span>AI 出题</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; color: #6E6E6E">20 题/天</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; font-weight: 700">不限</span></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px; align-items: center; min-height: 40px; padding: 0 14px; border-top: 1px solid #EFEFEF; font-size: 13px"><span>作文批改</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; color: #6E6E6E">1 篇/周</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; font-weight: 700">不限</span></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px; align-items: center; min-height: 40px; padding: 0 14px; border-top: 1px solid #EFEFEF; font-size: 13px"><span>真题整卷批改</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; color: #6E6E6E">1 套/周</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; font-weight: 700">不限</span></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px; align-items: center; min-height: 40px; padding: 0 14px; border-top: 1px solid #EFEFEF; font-size: 13px"><span>资料解析</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; color: #6E6E6E">100 页</span><span style="font-family: 'DM Sans',sans-serif; text-align: center; font-weight: 700">1000 页</span></div>
</section>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3"><button onClick="{{p.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; min-height: 108px; border-radius: 18px; border: 1.5px solid {{p.border}}; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer">
<span style="font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: {{p.tagBg}}; color: {{p.tagFg}}">{{p.tag}}</span>
<span style="font-size: 14px; font-weight: 700; color: #1A1A1A">{{p.name}}</span>
<span style="font-family: 'DM Sans',sans-serif; font-size: 20px; font-weight: 600; color: #1A1A1A">{{p.price}}</span>
<span style="font-size: 11px; color: #6E6E6E">{{p.term}}</span></button></sc-for></div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><a href="m6_payresult.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">{{cta}}</a>
<div style="display: flex; justify-content: space-between; align-items: center"><a href="m6_redeem.dc.html" style="min-height: 40px; display: flex; align-items: center; font-size: 13px; color: #1A1A1A; text-decoration: none">有兑换码？</a><a href="m0_agreement.dc.html" style="min-height: 40px; display: flex; align-items: center; font-size: 12px; color: #6E6E6E; text-decoration: none">会员服务协议 · 不自动续费</a></div></div></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const plan = (this.state && this.state.plan) || 'season';
    const defs = [
      { id: 'sprint', tag: '今年冲刺', name: '冲刺卡', price: '¥59', term: '至 2026 年初试' },
      { id: 'season', tag: '推荐', name: '考季卡', price: '¥169', term: '至 2027 年初试' },
      { id: 'month', tag: '灵活', name: '月卡', price: '¥29.9', term: '30 天' }
    ];
    var cur = defs[1];
    defs.forEach(function (d) { if (d.id === plan) { cur = d; } });
    return {
      cta: '立即开通 ' + cur.price,
      plans: defs.map(function (d) {
        const on = d.id === plan;
        return {
          tag: d.tag, name: d.name, price: d.price, term: d.term,
          border: on ? '#1A1A1A' : '#EFEFEF',
          tagBg: d.id === 'season' ? '#1A1A1A' : '#F7F7F5',
          tagFg: d.id === 'season' ? '#FFFFFF' : '#1A1A1A',
          pick: function () { self.setState({ plan: d.id }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
