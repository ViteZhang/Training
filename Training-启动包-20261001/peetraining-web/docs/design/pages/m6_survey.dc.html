<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const r = s.r || 'yes';
    const a = s.a || 'wait';
    function opts(list, cur, key) {
      return list.map(function (d) {
        return { label: d.l, bg: d.id === cur ? '#1A1A1A' : '#F7F7F5', fg: d.id === cur ? '#FFFFFF' : '#1A1A1A', pick: function () { const n = {}; n[key] = d.id; self.setState(n); } };
      });
    }
    return {
      retest: opts([{ id: 'yes', l: '进复试' }, { id: 'no', l: '没进' }, { id: 'unk', l: '还不知道' }], r, 'r'),
      admit: opts([{ id: 'ok', l: '已录取' }, { id: 'adj', l: '调剂' }, { id: 'no', l: '未录取' }, { id: 'wait', l: '待定' }], a, 'a')
    };
  }
}
</script>
