<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>2.1f 修改目标分</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 52px 22px"><div style="display: flex; justify-content: space-between; align-items: center"><span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'DM Sans',sans-serif; font-size: 40px; font-weight: 600; letter-spacing: -1.5px; line-height: 1">83</span><span style="font-size: 13px; color: #6E6E6E">天后初试</span></span><span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; border: 1px solid #1A1A1A">强化期</span></div><div style="height: 190px; border-radius: 22px; border: 1px solid #EFEFEF"></div><div style="height: 180px; border-radius: 22px; background: #F7F7F5"></div></div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(20,20,20,0.45); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-label="修改目标分" style="padding: 10px 22px 30px; border-radius: 26px 26px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #D6D6D6"></span>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; font-weight: 700">修改目标分</span><span style="font-size: 13px; color: #6E6E6E">改完后，首页会按新目标算还差多少</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2"><section style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 18px; border: 1px solid #EFEFEF">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700"><span style="font-family: 'DM Sans',sans-serif">{{r.code}}</span> {{r.name}}</span><span style="font-size: 12px; color: #6E6E6E">{{r.est}}</span></div>
<sc-if value="{{r.isSet}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; justify-content: space-between">
<button onClick="{{r.dec}}" aria-label="目标分减 1" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F7F7F5; color: #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'DM Sans',sans-serif; font-size: 34px; font-weight: 600; letter-spacing: -1px; line-height: 1">{{r.target}}</span><span style="font-family: 'DM Sans',sans-serif; font-size: 13px; color: #6E6E6E">/ 150</span></span><span style="font-size: 12px; color: {{r.gapInk}}">{{r.gap}}</span></span>
<button onClick="{{r.inc}}" aria-label="目标分加 1" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F7F7F5; color: #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div></sc-if>
<sc-if value="{{r.notSet}}" hint-placeholder-val="{{ false }}"><button onClick="{{r.start}}" style="height: 44px; border-radius: 22px; border: 1px dashed #D6D6D6; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #1A1A1A">设个目标分</button></sc-if>
</section></sc-for>
<a href="m2_home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500; margin-top: 4px">保存</a>
<a href="m2_home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; color: #6E6E6E; text-decoration: none">取消</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const list = s.list || [
      { code: '654', name: '语言文学基础', target: 115, hi: 106, est: '预估 98–106' },
      { code: '908', name: '作文', target: null, hi: null, est: '还没有预估分' }
    ];
    const put = (i, patch) => this.setState({ list: list.map((x, j) => (j === i ? Object.assign({}, x, patch) : x)) });
    return {
      rows: list.map((x, i) => {
        const set = x.target !== null && x.target !== undefined;
        const t = set ? x.target : 0;
        let gap = '做完一套整卷后才能算差距';
        let gapInk = '#767676';
        if (set && x.hi !== null) {
          const d = t - x.hi;
          gap = d > 0 ? '比预估上限高 ' + d + ' 分' : '预估已经够到这个目标';
          gapInk = d > 0 ? '#8A3A16' : '#1F7A4D';
        }
        return {
          code: x.code, name: x.name, est: x.est, target: t,
          isSet: set, notSet: !set, gap, gapInk,
          dec: () => put(i, { target: Math.max(0, t - 1) }),
          inc: () => put(i, { target: Math.min(150, t + 1) }),
          start: () => put(i, { target: 105 })
        };
      })
    };
  }
}
</script>
</body>
</html>
