# 把本文件的两个 server 块追加到现有 nginx.conf 的 http { ... } 内。
# 这是配置片段，不可直接替换完整 nginx.conf。
# 生产域名：training.dreamerlab.cn；证书需覆盖此完整域名。
# API 和现有 dreamer-nginx 必须都加入 dreamer-net；API 不映射宿主机 8080。

server {
    listen 80;
    server_name training.dreamerlab.cn;

    return 301 https://training.dreamerlab.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name training.dreamerlab.cn;

    # 容器内路径；证书文件需包含站点证书和中间证书链，私钥单独存放。
    ssl_certificate     /etc/nginx/cert/training.dreamerlab.cn.pem;
    ssl_certificate_key /etc/nginx/cert/training.dreamerlab.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;

    # Docker 内置 DNS：API 容器重建后会重新解析容器地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $training_backend training-api:8080;

    # 普通 API 请求体限制为 2 MB；大文件使用应用提供的 OSS 直传。
    client_max_body_size 2m;

    location / {
        # 保留完整路径和参数，例如 /api/v1/health；不要删除 /api 前缀。
        proxy_pass http://$training_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
