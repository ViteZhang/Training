# 应用机（4 核 16G）：nginx、api、worker、asynqmon（仅内网）。
# 在 /opt/training 下运行：docker compose -f docker-compose.app.yml --env-file .env up -d
# .env 由 runbook 第 4 步创建，包含 IMAGE、VERSION 与全部应用环境变量（不进仓库）。
name: training

x-app: &app
  image: ${IMAGE:?需要在 .env 里设置 IMAGE}:${VERSION:?需要设置 VERSION}
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  api:
    <<: *app
    command: ["/app/api"]
    expose: ["8080"]
    stop_grace_period: 40s # 大于 SHUTDOWN_TIMEOUT（30s），让进行中的请求做完

  worker:
    <<: *app
    command: ["/app/worker"]
    stop_grace_period: 40s
    # 调度器全局只能有一个实例：worker 只部署一个，不要 scale。
    deploy:
      replicas: 1

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/training.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./admin:/usr/share/nginx/admin:ro # 管理后台静态文件，由前端流水线同步（T05）
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  asynqmon:
    image: ${ASYNQMON_IMAGE:-hibiken/asynqmon:latest}
    restart: unless-stopped
    command: ["--redis-addr=${REDIS_ADDR}", "--redis-password=${REDIS_PASSWORD}"]
    # 只绑定本机回环地址：通过 SSH 隧道访问（ssh -L 8081:127.0.0.1:8081 应用机），不对公网开放。
    ports: ["127.0.0.1:8081:8080"]
