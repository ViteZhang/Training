      type: object
      required: [id, qtype, stem, source, status_tag, attempt_count, path]
      properties:
        id: { type: integer, format: int64 }
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string, description: 题干（列表中截断到 120 字） }
        score: { type: number }
        source: { $ref: "#/components/schemas/QuestionSource" }
        exam_year: { type: integer }
        status_tag: { $ref: "#/components/schemas/QuestionStatusTag" }
        last_score: { type: number }
        attempt_count: { type: integer }
        path: { type: array, items: { type: string }, description: 所属板块 / 章节 }
        generated_from_kp: { type: string, description: AI 出题依据的知识点名称 }
    QuestionPage:
      type: object
      required: [items, facets]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } }
        facets:
          type: object
          required: [by_qtype, by_source, exam_years]
          properties:
            by_qtype:
              type: object
              additionalProperties: { type: integer }
              description: 各题型题数
            by_source:
              type: object
              additionalProperties: { type: integer }
            exam_years: { type: array, items: { type: integer } }
        next_cursor: { type: string }
    AttemptHistory:
      type: object
      required: [attempt_id, answered_at]
      properties:
        attempt_id: { type: integer, format: int64 }
        answered_at: { type: string, format: date-time }
        score: { type: number }
        full_score: { type: number }
        is_correct: { type: boolean }
        missed_points: { type: array, items: { type: string }, description: 遗漏的采分点 }
        loss_types:
          type: array
          items: { type: string, enum: [knowledge, norm, time] }
    QuestionDetail:
      type: object
      required: [id, qtype, stem, source, origin_tags, rubric_points, rubric_version, knowledge_points, attempts, in_wrong_book, needs_review]
      properties:
        id: { type: integer, format: int64 }
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" } }
        answer: { type: string }
        answer_origin: { $ref: "#/components/schemas/Origin" }
        analysis: { type: string }
        score: { type: number }
        source: { $ref: "#/components/schemas/QuestionSource" }
        exam_year: { type: integer }
        source_ref: { $ref: "#/components/schemas/SourceRef" }
        origin_tags:
          type: array
          description: 界面标注，如 ai_generated（AI 出题）、official（官方）
          items: { type: string }
        generated_from_kp_id: { type: integer, format: int64 }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPoint" } }
        rubric_version: { type: integer }
        knowledge_points:
          type: array
          items:
            type: object
            required: [id, name, is_primary]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              is_primary: { type: boolean }
        attempts: { type: array, items: { $ref: "#/components/schemas/AttemptHistory" } }
        in_wrong_book: { type: boolean }
        needs_review: { type: boolean }
        review_reasons: { type: array, items: { $ref: "#/components/schemas/ReviewReason" } }
    QuestionInput:
      type: object
      required: [qtype, stem]
      properties:
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string, minLength: 1 }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" } }
        answer: { type: string }
        analysis: { type: string }
        score: { type: number, minimum: 0 }
        source: { type: string, enum: [exam, exercise] }
        exam_year: { type: integer }
        kp_ids: { type: array, items: { type: integer, format: int64 }, description: 第一个为主知识点 }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPointInput" } }
    QuestionPatch:
      type: object
      properties:
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string, minLength: 1 }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" } }
        answer: { type: string }
        analysis: { type: string }
        score: { type: number, minimum: 0 }
        exam_year: { type: integer, nullable: true }
        kp_ids: { type: array, items: { type: integer, format: int64 } }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPointInput" } }
        needs_review: { type: boolean }

    BankOverview:
      type: object
      required: [subject_id, bank_id, question_count, kp_count, needs_review_count, material_count, mastery_distribution, has_official]
      properties:
        subject_id: { type: integer, format: int64 }
        bank_id: { type: integer, format: int64 }
        question_count: { type: integer }
        kp_count: { type: integer }
        needs_review_count: { type: integer }
        material_count: { type: integer }
        paper_count: { type: integer }
        mastery_distribution:
          type: object
          required: [unlearned, learning, consolidating, mastered]
          properties:
            unlearned: { type: integer }
            learning: { type: integer }
            consolidating: { type: integer }
            mastered: { type: integer }
        has_official: { type: boolean, description: 已添加官方题库 }
        is_essay: { type: boolean }

    MaterialDeletionImpact:
      type: object
      required: [question_count, attempt_count, wrong_count, kp_delete_count, kp_keep_count, paper_session_count]
      properties:
        question_count: { type: integer, description: 从它识别出的题（连同作答记录和错题一起删除） }
        attempt_count: { type: integer }
        wrong_count: { type: integer }
        kp_delete_count: { type: integer, description: 只来自这份资料的知识点，删除 }
        kp_keep_count: { type: integer, description: 其他资料也有的知识点，保留 }
        paper_session_count: { type: integer, description: 用它做过的整卷，成绩保留、预估分重算 }
    TextRange:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, description: 按字符（Unicode 码点）计 }
        end: { type: integer }
    MaterialPage:
      type: object
      required: [material_id, file_name, page_no, page_count, text, highlights, low_confidence, knowledge_points]
      properties:
        material_id: { type: integer, format: int64 }
        file_name: { type: string }
        page_no: { type: integer }
        page_count: { type: integer }
        text: { type: string }
        highlights: { type: array, items: { $ref: "#/components/schemas/TextRange" } }
        low_confidence: { type: array, items: { $ref: "#/components/schemas/TextRange" } }
        knowledge_points:
          type: array
          description: 本页还识别出的知识点
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }

    SearchHit:
      type: object
      required: [text, highlights]
      properties:
        text: { type: string, description: 命中片段 }
        highlights: { type: array, items: { $ref: "#/components/schemas/TextRange" } }
    SearchResult:
      type: object
      required: [knowledge_points, questions, material_pages]
      properties:
        knowledge_points:
          type: array
          items:
            type: object
            required: [id, name, hit]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              path: { type: array, items: { type: string } }
              hit: { $ref: "#/components/schemas/SearchHit" }
        questions:
          type: array
          items:
            type: object
            required: [id, qtype, hit]
            properties:
              id: { type: integer, format: int64 }
              qtype: { $ref: "#/components/schemas/QuestionType" }
              hit: { $ref: "#/components/schemas/SearchHit" }
        material_pages:
          type: array
          items:
            type: object
            required: [material_id, file_name, page_no, hit]
            properties:
              material_id: { type: integer, format: int64 }
              file_name: { type: string }
              page_no: { type: integer }
              hit: { $ref: "#/components/schemas/SearchHit" }
