        pending_effective_on: { type: string, format: date, description: 待生效的修改从这天起生效 }
        reminder_times: { type: array, items: { type: string } }
        target_school_major: { type: string }
        essay_weekly_goal: { type: integer }
        mock_time_reminders: { type: boolean }
        notify_daily: { type: boolean }
        notify_review_due: { type: boolean }
        notify_task_done: { type: boolean }

    SubjectInput:
      type: object
      required: [name, full_score]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        code: { type: string, maxLength: 16, nullable: true }
        full_score: { type: integer, enum: [100, 150, 300] }
        target_score: { type: integer, minimum: 0, nullable: true, description: 不设目标传 null }
    SubjectPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        code: { type: string, maxLength: 16, nullable: true }
        full_score: { type: integer, enum: [100, 150, 300] }
        target_score: { type: integer, minimum: 0, nullable: true }
        is_essay: { type: boolean, description: 用户纠正作文课判断（1.7），之后不再自动改 }
    Subject:
      type: object
      required: [id, name, full_score, is_essay, bank_id, question_count, kp_count, material_count]
