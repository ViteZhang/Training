        score: { type: number }
        source: { $ref: "#/components/schemas/QuestionSource" }
        exam_year: { type: integer }
        question_no: { type: string }
        is_recollection: { type: boolean }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPointInput" } }
        rubric_origin: { $ref: "#/components/schemas/Origin" }
        kp_path: { type: array, items: { type: string }, description: 板块 / 章节 / 知识点名称 }
