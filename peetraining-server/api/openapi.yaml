        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string }
        full_score: { type: integer }
        target_score: { type: integer }
        is_essay: { type: boolean, description: 作文课（如 908），题库页显示为 3.10 }
        bank_id: { type: integer, format: int64 }
        question_count: { type: integer }
        kp_count: { type: integer }
        material_count: { type: integer }
    SubjectList:
      type: object
      required: [items, max_subjects, can_add]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Subject" } }
        max_subjects: { type: integer, description: 当前身份最多几门（免费 3、会员 4） }
        can_add: { type: boolean }

    QuotaType:
      type: string
      enum: [parse_pages, import_questions, grading, ai_questions, paper_grading, essay_grading, subjects]
    QuotaItem:
      type: object
      required: [quota_type, used, period]
      properties:
        quota_type: { $ref: "#/components/schemas/QuotaType" }
        used: { type: integer }
        limit: { type: integer, nullable: true, description: 为空表示不限 }
        period: { type: string, enum: [total, monthly, daily, weekly], description: 重置周期 }
        resets_at: { type: string, format: date-time, description: 下次重置时间；累计额度为空 }
    QuotaSummary:
      type: object
      required: [membership, items]
      properties:
        membership: { $ref: "#/components/schemas/MembershipStatus" }
        items: { type: array, items: { $ref: "#/components/schemas/QuotaItem" } }

    MaterialCategory:
      type: string
      description: 题目类 / 参考类 / 作文类
      enum: [question, reference, essay]
    MaterialFormat:
      type: string
      enum: [docx, xlsx, pdf, image, text]
    MaterialStatus:
      type: string
      enum: [uploading, uploaded, parsing, parsed, partial, failed, rejected]
    Material:
      type: object
      required: [id, subject_id, file_name, format, status, page_count, billed_pages, question_count, kp_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        subject_id: { type: integer, format: int64 }
        category: { $ref: "#/components/schemas/MaterialCategory" }
        sub_type: { type: string, description: 真题汇编、习题集、参考书、讲义、笔记、作文真题、范文、写作笔记、评分细则 }
        file_name: { type: string }
        format: { $ref: "#/components/schemas/MaterialFormat" }
        status: { $ref: "#/components/schemas/MaterialStatus" }
        fail_reason: { type: string }
        page_count: { type: integer }
        billed_pages: { type: integer }
        question_count: { type: integer }
        kp_count: { type: integer }
        paper_count: { type: integer, description: 组成的真题卷数（6.3） }
        needs_review_count: { type: integer }
        incomplete: { type: boolean, description: 识别不完整，提醒用户 }
        created_at: { type: string, format: date-time }
    UploadFile:
      type: object
      required: [file_name, format, size_bytes, sha256]
      properties:
        file_name: { type: string, maxLength: 255 }
        format: { $ref: "#/components/schemas/MaterialFormat" }
        size_bytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        page_count: { type: integer, minimum: 1, description: 客户端已知的页数（PDF）；服务端会复核 }
        content_type: { type: string, example: application/pdf }
    UploadRequest:
      type: object
      required: [subject_id, files, right_confirmed]
      properties:
        subject_id: { type: integer, format: int64 }
        category: { $ref: "#/components/schemas/MaterialCategory" }
        files: { type: array, minItems: 1, maxItems: 30, items: { $ref: "#/components/schemas/UploadFile" } }
        right_confirmed: { type: boolean, description: 「我确认对这些资料有合法的使用权，仅用于本人学习」，必须为 true }
    UploadTarget:
      type: object
      required: [index, material_id]
      properties:
        index: { type: integer, description: 对应请求 files 的下标 }
        material_id: { type: integer, format: int64 }
        upload_url: { type: string, description: OSS 预签名 PUT 地址；重复文件为空 }
        upload_headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
        duplicate: { type: boolean, description: 已上传过相同内容的文件，material_id 指向它，不需要上传 }
    UploadRequestResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/UploadTarget" } }
    PasteMaterialRequest:
      type: object
      required: [subject_id, text, right_confirmed]
      properties:
        subject_id: { type: integer, format: int64 }
        category: { $ref: "#/components/schemas/MaterialCategory" }
        title: { type: string, maxLength: 64 }
        text: { type: string, minLength: 1, maxLength: 20000 }
        right_confirmed: { type: boolean }

    ImportMode:
      type: string
      description: 1.4 选的导入方式：题目 / 资料（拆成知识点） / 作文资料
      enum: [question, reference, essay]
    CreateImportJobRequest:
      type: object
