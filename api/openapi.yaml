        forgot_count: { type: integer, description: 可以「再背没记住的」的条数 }
        previous_remembered: { type: integer, description: 上一轮记住的条数（同一门课） }
        schedule:
          type: object
          required: [tomorrow, two_days, later]
          properties:
            tomorrow: { type: integer, description: 明天（没记住） }
