openapi: 3.0.3
info:
  title: 考研Training API
  version: 0.17.0
  description: |
    考研Training 后端接口契约。契约先行：改接口先改本文件，再执行 make gen。

    约定（详见 docs/dev-spec.md 与 CLAUDE.md）：
    - 路由前缀 /api/v1，后台接口 /api/v1/admin
    - 鉴权：`Authorization: Bearer <access_token>`；标了 `security: []` 的接口不需要登录
    - 错误响应统一为 Error：{ code, message, detail }，错误码见 Error.code 说明
    - 写接口支持 `Idempotency-Key` 请求头：同一个键重复提交返回第一次的结果，不重复扣额度
    - 用户内容只有本人可见：访问别人的 ID 一律返回 404
    - 功能开关关闭时，相关接口返回 404
    - 时间字段为 RFC 3339（UTC）；日期字段（如复习日）为北京时间的 YYYY-MM-DD
    - 列表分页用游标：响应里的 next_cursor 为空表示没有更多

    契约版本：
    - api-v0.1：模块 0 账号、模块 1 引导与导入、模块 3 题库、额度、功能开关
    - api-v0.2：考情分析 3.8、知识图谱 3.9、作文知识库 3.10（T14）
    - api-v0.3：今日首页 2.1、阶段提示 2.1e、今日计划与完成统计 2.2（T16）
    - api-v0.12：会员中心 6.5、订单与支付结果 6.6、支付回调（T25）
    - api-v0.13：邀请研友 6.8（T26）
    - api-v0.14：消息中心 2.3（T27）
    - api-v0.15：管理后台运营与质量 7.1–7.7、后台账号与两步验证（T28）
    - api-v0.16：管理后台配置与系统 7.8、7.9、7.15（T29）
    - api-v0.17：官方题库 7.10–7.14 与 App 添加官方题库（T30）
    - 其余模块随对应任务卡增量加入，10/11 冻结 api-v1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: membership
    description: 会员中心与在线支付（T25）；在线支付受 online_payment 开关控制，默认关闭
  - name: admin
    description: |
      管理后台（T28）。鉴权用 adminAuth（后台会话令牌，8 小时），与 App 的用户令牌分开；每个接口在 x-roles 声明可访问的角色，
      没声明的一律拒绝；管理员拥有全部权限。所有写操作记 admin_audit_logs。后台看不到用户内容，只有授权查看接口能读，
      每次读取都记 content_access_logs 并通知用户。
  - name: mine
    description: 模块 6 · 我的：导出题库、兑换码、意见反馈、考后回访
  - name: essay
    description: 模块 5 · 作文（选题、写作、拍照、批改、作文本、评分标准）
  - name: score
    description: 4.24–4.25 整卷报告与时间分析、2.1 预估分、6.2 提分看板
  - name: paper
    description: 模块 4 · 整卷与模拟考试
  - name: practice
    description: 模块 4 · 练习、客观题与错题本
  - name: today
    description: 模块 2 · 今日首页与今日计划
  - name: system
    description: 健康检查与启动配置
  - name: auth
    description: 模块 0 · 登录、令牌、协议
  - name: account
    description: 6.11–6.12 账号与安全、注销
  - name: profile
    description: 1.1–1.3、6.9 专业课与备考档案
  - name: quota
    description: 额度（PRD 13.1）
  - name: import
    description: 1.4–1.8 上传资料、AI 解析、确认入库
  - name: bank
    description: 模块 3 题库：知识点、题目、资料
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 健康检查
      description: 返回版本号与 MySQL、Redis 的连通状态；不暴露连接细节。任一依赖不通时返回 503。
      security: []
      responses:
        "200":
          description: 全部依赖正常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 至少一个依赖异常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /bootstrap:
    get:
      tags: [system]
      operationId: getBootstrap
      summary: 启动配置（0.1）
      description: |
        App 每次启动调用。返回版本更新（0.6 / 0.6b）、需要重新同意的协议（0.4b）、功能开关、初试倒计时。
        未登录也可调用；登录后带上令牌，会额外返回用户维度的开关与协议状态。
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: platform, in: query, required: true, schema: { $ref: "#/components/schemas/Platform" } }
        - { name: app_version, in: query, required: true, schema: { type: string, example: 1.0.3 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }

  /auth/sms-codes:
    post:
      tags: [auth]
      operationId: sendSmsCode
      summary: 发送短信验证码（0.2、0.3、6.11）
      description: |
        6 位验证码，5 分钟有效；同一手机号 60 秒一次、每天最多 10 次。
        purpose=login 时必须 agree=true（0.2b 未同意协议时不发码）。
        purpose=change_phone_old / change_phone_new 需要登录。
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendSmsCodeRequest" }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendSmsCodeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 手机号 + 验证码登录（未注册自动创建账号）
      description: |
        验证码错误返回 400，detail.remaining_attempts 为剩余次数；连续错 5 次该码失效（detail.code_expired=true）。
        注销冷静期内登录会撤销注销申请。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 刷新访问令牌
      description: 刷新令牌按设备存储，每次刷新都会换发新的刷新令牌（旧的立即失效）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 退出登录（作废本设备的刷新令牌）
      responses:
        "204": { description: 已退出 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agreements/{kind}:
    get:
      tags: [auth]
      operationId: getAgreement
      summary: 协议正文（0.4）
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/AgreementKind" } }
      responses:
        "200":
          description: 当前生效版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: 当前用户
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [account]
      operationId: updateMe
      summary: 修改昵称或记录引导进度
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/agreements:
    post:
      tags: [account]
      operationId: acceptAgreements
      summary: 同意协议新版本（0.4b「同意并继续」）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreement_ids]
              properties:
                agreement_ids: { type: array, items: { type: integer, format: int64 }, minItems: 1 }
      responses:
        "204": { description: 已记录 }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/devices:
    get:
      tags: [account]
      operationId: listDevices
      summary: 登录设备列表（6.11）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Device" } }

  /me/devices/{deviceId}:
    delete:
      tags: [account]
      operationId: removeDevice
      summary: 移除其他设备（该设备需重新登录）
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已移除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/phone:
    put:
      tags: [account]
      operationId: changePhone
      summary: 更换手机号（新旧号码都要验证）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePhoneRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/deletion:
    post:
      tags: [account]
      operationId: requestDeletion
      summary: 申请注销（6.12），进入 7 天冷静期
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, description: 必须为 true（勾选确认） }
      responses:
        "200":
          description: 已申请
          content:
            application/json:
              schema:
                type: object
                required: [deletion_due_at]
                properties:
                  deletion_due_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [account]
      operationId: cancelDeletion
      summary: 撤销注销申请
      responses:
        "204": { description: 已撤销 }

  /feature-flags:
    get:
      tags: [system]
      operationId: getFeatureFlags
      summary: 当前用户可见的功能开关
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlags" }

  /exam-years:
    get:
      tags: [profile]
      operationId: listExamYears
      summary: 可选的考试年份与初试日期（1.1）
      security: [{}, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ExamYear" } }

  /profile:
    get:
      tags: [profile]
      operationId: getProfile
      summary: 备考档案（1.3、6.9）
      description: 还没建档案时返回 404，App 进入 1.1。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [profile]
      operationId: upsertProfile
      summary: 创建或修改备考档案
      description: 改阶段或每日时长从明天起生效（pending_* 字段）；第一次创建时立即生效。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /subjects:
    get:
      tags: [profile]
      operationId: listSubjects
      summary: 我的专业课
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectList" }
    post:
      tags: [profile]
      operationId: createSubject
      summary: 添加专业课（同时建好它的自建题库）
      description: 最多 4 门；免费版最多 3 门，第 4 门返回 402 QUOTA_EXCEEDED（detail.reason=subject_limit），App 引导到 6.5。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubjectInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }

  /subjects/{subjectId}:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    patch:
      tags: [profile]
      operationId: updateSubject
      summary: 修改专业课（名称、代码、满分、目标分、是否作文课）
      description: 改目标分立即生效（2.1f）；target_score 传 null 表示清除目标。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubjectPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [profile]
      operationId: deleteSubject
      summary: 删除专业课（连同它的题库、资料和学习记录）
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /quota:
    get:
      tags: [quota]
      operationId: getQuota
      summary: 会员状态与各项额度（3.1c、6.3、4.9）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaSummary" }

  /materials/upload-requests:
    post:
      tags: [import]
      operationId: createUploadRequests
      summary: 申请上传（1.5）
      description: |
        为每个文件返回 OSS 预签名直传地址。必须 right_confirmed=true。
        同一用户已上传过相同内容（sha256 相同）的文件，返回 duplicate_material_id，不再上传、不重复扣额度。
        超过单次上限返回 400；解析额度不足返回 402（detail 给出所需与剩余页数），在开始前提示。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadRequestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }

  /materials/{materialId}/uploaded:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    post:
      tags: [import]
      operationId: confirmMaterialUploaded
      summary: 客户端直传完成后回调
      description: 服务端核对对象存在、大小一致，并计算页数与计费页数。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /materials/paste:
    post:
      tags: [import]
      operationId: createPastedMaterial
      summary: 粘贴文字导入（1.5b），单次最多 2 万字
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasteMaterialRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import-jobs:
    get:
      tags: [import]
      operationId: listImportJobs
      summary: 我的导入任务（首页 2.1b 用 active=true）
      parameters:
        - { name: active, in: query, schema: { type: boolean }, description: 只返回解析中或待确认的任务 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ImportJob" } }
    post:
      tags: [import]
      operationId: createImportJob
      summary: 开始解析（1.5 → 1.6）
      description: 按计费页数预占解析额度，失败页在解析结束后退回。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateImportJobRequest" }
      responses:
        "201":
          description: 已开始
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import-jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [import]
      operationId: getImportJob
      summary: 解析进度（1.6、1.6b）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import-jobs/{jobId}/materials/{materialId}/retry:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/MaterialId"
    post:
      tags: [import]
      operationId: retryImportMaterial
      summary: 重新解析失败的文件（1.6b，如重新拍照后）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /import-jobs/{jobId}/materials/{materialId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/MaterialId"
    delete:
      tags: [import]
      operationId: removeImportMaterial
      summary: 从任务里移除文件（1.6b「移除」），已预占的额度退回
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import-jobs/{jobId}/items:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [import]
      operationId: listImportItems
      summary: 待确认条目（1.7）
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, needs_review, subjective, objective], default: all }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportItemPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import-jobs/{jobId}/confirm:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [import]
      operationId: confirmImportJob
      summary: 确认入库（1.7「确认入库 N 题」）
      description: |
        除已删除的条目外全部入库；需核对的条目带标记入库。可多次调用（部分完成时先确认已识别的部分）。
        入库后立即生成今日计划（1.8）。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                item_ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: 只确认这些条目；不传表示全部未删除的条目
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmImportResult" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [import]
      operationId: getImportItem
      summary: 单个待确认条目（1.7b）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportItem" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [import]
      operationId: updateImportItem
      summary: 修改或删除待确认条目（1.7、1.7b）
      description: 主观题采分点分值合计必须等于题目分值，否则返回 400（detail.reason=rubric_sum_mismatch）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportItemPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import-items/{itemId}/generate-answer:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [import]
      operationId: generateImportItemAnswer
      summary: 缺答案时让 AI 生成参考答案与采分点（标「AI 生成」），计入每日 AI 出题额度
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportItem" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/AIFailed" }

  /subjects/{subjectId}/bank:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [bank]
      operationId: getBankOverview
      summary: 题库概况（题库页头部、2.1「我的题库」卡）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankOverview" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/knowledge-tree:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [bank]
      operationId: getKnowledgeTree
      summary: 知识点树（3.1）
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, unmastered, exam, needs_review], default: all }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sections, needs_review_count]
                properties:
                  sections: { type: array, items: { $ref: "#/components/schemas/KnowledgeNode" } }
                  needs_review_count: { type: integer, description: 「N 处待核对」提醒条 }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/knowledge-points:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    post:
      tags: [bank]
      operationId: createKnowledgeNode
      summary: 新建板块、章节或知识点（用户手动调整树结构）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeNodeInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgePointDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-points/{kpId}:
    parameters:
      - $ref: "#/components/parameters/KpId"
    get:
      tags: [bank]
      operationId: getKnowledgePoint
      summary: 知识点卡片（3.4）
      description: 第一次打开时同步生成并缓存 AI 解读（≤ 5 秒）；生成失败时 ai_explanation 为空、不影响其他字段。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgePointDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [bank]
      operationId: updateKnowledgePoint
      summary: 编辑知识点（3.6）或调整归属
      description: 改了采分点后，相关题目之后按新采分点批改，AI 解读重新生成，历史批改不变。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgePointPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgePointDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [bank]
      operationId: deleteKnowledgePoint
      summary: 删除知识点（3.5）
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-points/{kpId}/merge:
    parameters:
      - $ref: "#/components/parameters/KpId"
    post:
      tags: [bank]
      operationId: mergeKnowledgePoint
      summary: 合并到其他知识点（3.5），题目关联、掌握度与作答记录一并迁移
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id: { type: integer, format: int64 }
      responses:
        "200":
          description: 合并后的目标知识点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgePointDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-points/{kpId}/split:
    parameters:
      - $ref: "#/components/parameters/KpId"
    post:
      tags: [bank]
      operationId: splitKnowledgePoint
      summary: 拆分为多个知识点（3.5）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, maxLength: 128 }
                      original_text: { type: string }
      responses:
        "200":
          description: 拆分出的知识点
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KnowledgePointDetail" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-points/{kpId}/explanation:
    parameters:
      - $ref: "#/components/parameters/KpId"
    post:
      tags: [bank]
      operationId: regenerateExplanation
      summary: AI 解读不准，重新生成（3.5）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgePointDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/AIFailed" }

  /knowledge-points/{kpId}/self-assessment:
    parameters:
      - $ref: "#/components/parameters/KpId"
    put:
      tags: [bank]
      operationId: selfAssessKnowledgePoint
      summary: 三档自评（3.4，只作参考）
      description: 只对还没有作答记录的知识点设定掌握分（D16），已有作答记录时只记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { $ref: "#/components/schemas/SelfAssessLevel" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mastery" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/questions:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [bank]
      operationId: listQuestions
      summary: 题目列表（3.1b）
      parameters:
        - { name: qtype, in: query, schema: { $ref: "#/components/schemas/QuestionType" } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/QuestionSource" } }
        - { name: exam_year, in: query, schema: { type: integer } }
        - { name: kp_id, in: query, schema: { type: integer, format: int64 }, description: 某知识点（含子节点）下的题 }
        - { name: status, in: query, schema: { type: string, enum: [mastered, wrong, needs_review, unanswered] } }
        - { name: sort, in: query, schema: { type: string, enum: [chapter, recent], default: chapter } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [bank]
      operationId: createQuestion
      summary: 手动添加一道题
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }

  /questions/{questionId}:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    get:
      tags: [bank]
      operationId: getQuestion
      summary: 题目详情（3.3）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [bank]
      operationId: updateQuestion
      summary: 编辑题目（3.3 右上角编辑）
      description: 改了采分点后之后的批改按新采分点，历史批改不变；采分点分值合计必须等于题目分值。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [bank]
      operationId: deleteQuestion
      summary: 删除题目（连同作答记录与错题）
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/materials:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [bank]
      operationId: listMaterials
      summary: 资料列表（3.1c、6.3）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Material" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /materials/{materialId}:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      tags: [bank]
      operationId: getMaterial
      summary: 单份资料
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [bank]
      operationId: deleteMaterial
      summary: 删除资料（3.1d），连带规则见 PRD 11.12
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /materials/{materialId}/deletion-impact:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      tags: [bank]
      operationId: getMaterialDeletionImpact
      summary: 删除前说明连带影响（3.1d）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialDeletionImpact" }
        "404": { $ref: "#/components/responses/NotFound" }

  /materials/{materialId}/pages/{pageNo}:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
      - { name: pageNo, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [bank]
      operationId: getMaterialPage
      summary: 原文查看（3.7）
      parameters:
        - { name: highlight, in: query, schema: { type: string }, description: 要定位高亮的文字（如知识点原文表述） }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/search:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [bank]
      operationId: searchBank
      summary: 在当前专业课内搜索（3.2）
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/exam-profile:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [bank]
      operationId: getExamProfile
      summary: 考情分析（3.8，PRD 11.11）
      description: |
        只统计来源为真题、有年份、有分值的题；至少 2 套真题卷（不同年份）才有统计，否则 ready=false 并提示再导入。
        出题风格标签由 AI 生成并缓存，真题变化后重新生成；生成失败时为空，不影响其他统计。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamProfile" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/knowledge-graph:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [bank]
      operationId: getKnowledgeGraph
      summary: 知识图谱（3.9）
      description: 第一次打开时由 AI 按资料章节和同题出现整理关联并保存；之后用户可增删。节点颜色 = 掌握状态，大小 = 真题次数。
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, weak, exam], default: all }
        - name: section_id
          in: query
          schema: { type: integer, format: int64 }
          description: 只看某个板块
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeGraph" }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-points/{kpId}/relations:
    parameters:
      - $ref: "#/components/parameters/KpId"
    post:
      tags: [bank]
      operationId: createKnowledgeRelation
      summary: 在知识点卡片里添加关联（3.9「可在卡片里调整」）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, relation_type]
              properties:
                target_id: { type: integer, format: int64 }
                relation_type: { $ref: "#/components/schemas/RelationType" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeRelation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-relations/{relationId}:
    parameters:
      - { name: relationId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [bank]
      operationId: deleteKnowledgeRelation
      summary: 删除关联
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/essay-kb:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [bank]
      operationId: getEssayKnowledgeBase
      summary: 作文知识库（3.10）：写作方法、素材库、范文、作文题与当前评分标准
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EssayKnowledgeBase" }
        "404": { $ref: "#/components/responses/NotFound" }

  /essay-materials/{essayMaterialId}/favorite:
    parameters:
      - { name: essayMaterialId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [bank]
      operationId: setEssayMaterialFavorite
      summary: 收藏或取消收藏素材（3.10）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite: { type: boolean }
      responses:
        "204": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /home:
    get:
      tags: [today]
      operationId: getHome
      summary: 今日首页聚合（2.1、2.1b、2.1c、2.1d）
      description: |
        首页按状态四选一：还没导入资料（no_material）→ 题库整理中（organizing）→ 今日已完成（done）→ 正常（normal）。
        今日计划不存在时当场生成（北京时间 0 点定时任务之外的兜底）。预估分卡在 T22 接通前为空数组。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }

  /home/stage-prompt:
    post:
      tags: [today]
      operationId: answerStagePrompt
      summary: 进入新阶段提示（2.1e）：「好的」切换，「暂不切换」留在当前阶段；同一目标阶段只弹一次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }

  /plans/today:
    get:
      tags: [today]
      operationId: getTodayPlan
      summary: 今日计划明细（各组题目、预计用时、完成情况）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodayPlan" }

  /plans/today/summary:
    get:
      tags: [today]
      operationId: getTodaySummary
      summary: 今日训练完成（2.2）：连续打卡、题数、正确率、用时、掌握度变化、失分归因、明天的预计计划
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodaySummary" }

  /subjects/{subjectId}/practice:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [practice]
      operationId: getPracticeHome
      summary: 训练首页（4.1）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeHome" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/practice/preview:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    post:
      tags: [practice]
      operationId: previewPractice
      summary: 自定义练习实时显示符合条件的题数和预计用时（4.2）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeConfig" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticePreview" }
        "404": { $ref: "#/components/responses/NotFound" }

  /practice-sessions:
    post:
      tags: [practice]
      operationId: createPracticeSession
      summary: 开始一组练习（今日训练、题型专项、自定义、错题重做、摸底测）
      description: |
        今日训练当天只有一个会话，重复开始返回同一个（从断点继续）。
        自定义练习打开「AI 出变式题」且题库不够时，按资料里的知识点出题补足，消耗 AI 出题额度；额度不够时只用题库里的题。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePracticeSessionRequest" }
      responses:
        "201":
          description: 已创建（或返回已有的进行中会话）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /practice-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [practice]
      operationId: getPracticeSession
      summary: 练习会话（含整组题目与客观题答案，供离线作答）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /practice-sessions/{sessionId}/progress:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      tags: [practice]
      operationId: savePracticeProgress
      summary: 退出时保存断点（4.10）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cursor_index]
              properties:
                cursor_index: { type: integer, minimum: 0 }
      responses:
        "204": { description: 已保存 }
        "404": { $ref: "#/components/responses/NotFound" }

  /practice-sessions/{sessionId}/attempts:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [practice]
      operationId: submitAttempt
      summary: 提交一次作答（客观题判分、看答案、自评；离线作答联网后用同一接口补交，服务端复核）
      description: 同一个 idempotency_key 重复提交返回第一次的结果，不重复更新掌握分。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAttemptRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /practice-sessions/{sessionId}/finish:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [practice]
      operationId: finishPracticeSession
      summary: 结束本组并生成总结（4.11）；已结束的再调用返回同一份总结
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/wrong-book:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [practice]
      operationId: getWrongBook
      summary: 错题本（4.12）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WrongBook" }
        "404": { $ref: "#/components/responses/NotFound" }

  /wrong-book/{questionId}:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    delete:
      tags: [practice]
      operationId: removeFromWrongBook
      summary: 手动移出错题本
      responses:
        "204": { description: 已移出 }
        "404": { $ref: "#/components/responses/NotFound" }

  /questions/{questionId}/report:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    post:
      tags: [practice]
      operationId: reportQuestion
      summary: 「题目有问题」报错（4.3）；AI 出的题被报错 3 次自动下线
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [offline]
                properties:
                  offline: { type: boolean, description: 题目已下线，不再出现在练习里 }
        "404": { $ref: "#/components/responses/NotFound" }

  /practice-sessions/{sessionId}/gradings:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [practice]
      operationId: submitSubjective
      summary: 提交主观题并按采分点批改（4.4 → 4.6 → 4.7）
      description: |
        同步批改，目标 8 秒内。成功扣 1 次批改次数（与写结果同一事务）；批改失败返回 AI_FAILED，不扣次数、不保存，客户端保留草稿可重试。
        今日次数用完时答案照样保存，status 为 queued_quota（4.9），次日 0 点后可一键提交待批改。
        同一个 idempotency_key 重复提交返回第一次的结果。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSubjectiveRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AIFailed" }

  /gradings/{gradingId}:
    parameters:
      - $ref: "#/components/parameters/GradingId"
    get:
      tags: [practice]
      operationId: getGrading
      summary: 批改结果（4.7）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradingResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /gradings/{gradingId}/regrade:
    parameters:
      - $ref: "#/components/parameters/GradingId"
    post:
      tags: [practice]
      operationId: regradeAfterRubricChange
      summary: 改了采分点后按新采分点重批（4.8「采分点本身不对」），不扣次数
      description: 采分点没有改过时返回 409。以重批结果为准回算掌握度与错题；历史批改保留。
      responses:
        "200":
          description: 重批结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradingResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AIFailed" }

  /gradings/{gradingId}/disputes:
    parameters:
      - $ref: "#/components/parameters/GradingId"
    post:
      tags: [practice]
      operationId: createDispute
      summary: 批改异议（4.8）：提交复核重批一次，不扣次数
      description: 每次批改只能复核一次（重复提交返回 409）。勾选授权时后台可在 72 小时内查看这道题和答案（7.6 抽检）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeRequest" }
      responses:
        "200":
          description: 复核重批结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AIFailed" }

  /gradings/pending:
    get:
      tags: [practice]
      operationId: listPendingGradings
      summary: 待批改（4.9「明天再批改」存下的答案）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingGradings" }

  /gradings/pending/submit:
    post:
      tags: [practice]
      operationId: submitPendingGradings
      summary: 一键提交待批改：按存入顺序批改，次数用完为止
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [graded, remaining_pending, results]
                properties:
                  graded: { type: integer }
                  remaining_pending: { type: integer }
                  results: { type: array, items: { $ref: "#/components/schemas/GradingResult" } }

  /handwriting/upload-requests:
    post:
      tags: [practice]
      operationId: requestHandwritingUploads
      summary: 拍手写稿：申请照片直传地址（4.5，一次最多 6 张，单张 10MB 以内）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    required: [content_type, size]
                    properties:
                      content_type: { type: string, enum: [image/jpeg, image/png, image/heic, image/webp] }
                      size: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [object_key, upload_url, upload_headers, expires_at]
                      properties:
                        object_key: { type: string }
                        upload_url: { type: string }
                        upload_headers: { type: object, additionalProperties: { type: string } }
                        expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }

  /handwriting/recognize:
    post:
      tags: [practice]
      operationId: recognizeHandwriting
      summary: 识别手写稿（4.5）：多张按顺序拼接，返回文字与不确定的字词位置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_keys]
              properties:
                object_keys: { type: array, minItems: 1, maxItems: 6, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandwritingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/answer-norms/{qtype}:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
      - name: qtype
        in: path
        required: true
        schema: { type: string, enum: [term, short_answer, discussion] }
    get:
      tags: [practice]
      operationId: getAnswerNorm
      summary: 答题规范（4.13）：题型结构、高分写法（用户资料原文与采分点）、你上次的写法（标出缺了什么）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerNorm" }
        "404": { $ref: "#/components/responses/NotFound" }

  /questions/{questionId}/norm-check:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    post:
      tags: [practice]
      operationId: checkAnswerNorm
      summary: 按结构写一道（4.13）：AI 按题型结构批改各要素是否具备，扣 1 次批改次数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer_text, idempotency_key]
              properties:
                answer_text: { type: string, minLength: 1, maxLength: 20000 }
                idempotency_key: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NormCheckResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AIFailed" }

  /recite-sessions:
    post:
      tags: [practice]
      operationId: createReciteSession
      summary: 开始一轮背诵（4.14）：到期的和从没背过的知识点，今日计划里的优先；或「再背没记住的」
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id]
              properties:
                subject_id: { type: integer, format: int64 }
                retry_of: { type: integer, format: int64, description: 再背这一轮里没记住的 }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReciteSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /recite-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [practice]
      operationId: getReciteSession
      summary: 背诵会话（含原文、挖空位置与关键词）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReciteSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /recite-sessions/{sessionId}/records:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [practice]
      operationId: recordRecite
      summary: 记一条背诵结果（挖空自评 / 默写比对 / 口述比对），按 PRD 11.1、11.3 更新掌握分与背诵复习日
      description: |
        挖空按自评结果记；默写与口述按关键词覆盖判定（全部写到为记住了，过半为模糊，其余没记住），不调模型。
        口述受功能开关 oral_recite 控制，关闭时返回 404。同一个 idempotency_key 重复提交返回第一次的结果。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReciteRecordRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReciteRecordResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /recite-sessions/{sessionId}/audio-upload:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [practice]
      operationId: requestReciteAudioUpload
      summary: 口述录音直传地址（4.16，功能开关 oral_recite，关闭时 404）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size]
              properties:
                content_type: { type: string, enum: [audio/m4a, audio/mp4, audio/aac, audio/wav, audio/mpeg] }
                size: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [object_key, upload_url, upload_headers, expires_at]
                properties:
                  object_key: { type: string }
                  upload_url: { type: string }
                  upload_headers: { type: object, additionalProperties: { type: string } }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /recite-sessions/{sessionId}/finish:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [practice]
      operationId: finishReciteSession
      summary: 背诵完成（4.17）：本轮记住 / 模糊 / 没记住，与上一轮对比，下次复习安排
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReciteSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/papers:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [paper]
      operationId: listPapers
      summary: 整卷列表（4.18）：真题卷按年份，AI 组卷；每套的进行中 / 已完成 / 未开始
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperList" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [paper]
      operationId: composePaper
      summary: AI 组卷（PRD 11.10）：标准卷 / 针对卷，按最近一套真题卷的结构从题库抽题，不够时用 AI 变式题补足并逐题标出
      description: 组卷需要本周还有整卷批改次数（做这套卷时扣）；补足的变式题不另计 AI 出题额度。没有导入真题卷时返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [ai_standard, ai_targeted] }
      responses:
        "201":
          description: 已组卷
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }

  /papers/{paperId}:
    parameters:
      - $ref: "#/components/parameters/PaperId"
    get:
      tags: [paper]
      operationId: getPaper
      summary: 选择作答模式（4.19）：题数、满分、时长、各题型建议用时（PRD 11.9）、按阶段推荐的模式
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /papers/{paperId}/sessions:
    parameters:
      - $ref: "#/components/parameters/PaperId"
    post:
      tags: [paper]
      operationId: startPaper
      summary: 开始做一套卷（练习模式 / 模拟考试）
      description: |
        同一用户同一时间只能有一套进行中（409，detail.session_id 指向进行中的那套）。
        开始时预占 1 次本周整卷批改次数，交卷时结算，放弃时退回。模拟考试的截止时间以服务端 deadline_at 为准。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, idempotency_key]
              properties:
                mode: { $ref: "#/components/schemas/PaperMode" }
                idempotency_key: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "201":
          description: 已开始
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperSession" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /paper-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [paper]
      operationId: getPaperSession
      summary: 整卷作答（4.20 / 4.21 / 4.22）：题目、草稿、标记、每题用时、服务端时间与截止时间；模拟考试过了截止时间会自动交卷
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /paper-sessions/{sessionId}/items/{seq}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: seq
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      tags: [paper]
      operationId: updatePaperItem
      summary: 保存一道题的草稿、标记与停留用时（客户端每 5 秒同步一次）
      description: 客观题的 draft_text 是选中的选项字母。交卷后或模拟考试过了截止时间返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                draft_text: { type: string, maxLength: 20000 }
                marked: { type: boolean }
                time_spent_delta: { type: integer, minimum: 0, maximum: 600, description: 距上次同步在这道题上停留的秒数 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperItem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /paper-sessions/{sessionId}/pause:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [paper]
      operationId: pausePaper
      summary: 暂停（只有练习模式可以）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperSession" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /paper-sessions/{sessionId}/resume:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [paper]
      operationId: resumePaper
      summary: 继续作答。练习模式取消暂停；模拟考试因系统原因中断时，10 分钟内可恢复一次并补回中断时长（PRD 11.9）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                interrupted_at: { type: string, format: date-time, description: 模拟考试：本机记录的中断开始时间 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperSession" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /paper-sessions/{sessionId}/submit:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [paper]
      operationId: submitPaper
      summary: 交卷（4.23）：客观题即时出分，主观题后台按采分点逐题批改（约 2 分钟），完成后发消息；重复交卷返回同一结果
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /paper-sessions/{sessionId}/abandon:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [paper]
      operationId: abandonPaper
      summary: 放弃这套卷（退回预占的整卷批改次数）
      responses:
        "204": { description: 已放弃 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /paper-sessions/{sessionId}/report:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [score]
      operationId: getPaperReport
      summary: 整卷报告（4.24）与时间分析（4.25，只有模拟考试有）
      description: 还在批改时返回 409。分数为 AI 批改得分，仅供参考；只有导入的真题卷计入预估分。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReport" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /subjects/{subjectId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [score]
      operationId: getDashboard
      summary: 提分看板（6.2）
      description: 预估分卡与按周趋势、近 30 天失分归因、各板块掌握度 × 真题分值占比（与 3.8 一致）、「以为会了」、最近整卷成绩。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/false-mastery/plan:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    post:
      tags: [score]
      operationId: addFalseMasteryToToday
      summary: 把「以为会了」的知识点加入今日训练（6.2）
      description: 每个知识点加一道今天计划里还没有的题，记在「薄弱查漏」组；返回加了几道（0 表示没有可加的题）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/essay-home:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [essay]
      operationId: getEssayHome
      summary: 作文训练（5.1、5.1b）
      description: 本周目标与完成、平均分、当前评分标准；真题题目（已写稿数、最高分、范文数）、AI 命题、未提交的草稿。no_material=true 时显示 5.1b 引导导入。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EssayHome" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/essay-topics:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    post:
      tags: [essay]
      operationId: generateEssayTopic
      summary: AI 命题（5.1「再出一道」）
      description: 按用户作文真题的命题方式出一道新题，标「AI 出题」；计 1 道 AI 出题额度。
      responses:
        "201":
          description: 已出题
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EssayAITopic" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/AIFailed" }

  /essays:
    post:
      tags: [essay]
      operationId: createEssay
      summary: 开始写一篇作文（5.2）
      description: 真题（question_id）、AI 命题（ai_topic_id）、自拟（topic_text）三选一；parent_essay_id 为「按建议重写」，沿用原题记为下一稿。真题默认限时。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                subject_id: { type: integer, format: int64 }
                topic_source: { $ref: "#/components/schemas/EssayTopicSource" }
                question_id: { type: integer, format: int64 }
                ai_topic_id: { type: integer, format: int64 }
                topic_text: { type: string, maxLength: 2000 }
                required_words: { type: integer }
                parent_essay_id: { type: integer, format: int64 }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Essay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /essays/{essayId}:
    parameters:
      - $ref: "#/components/parameters/EssayId"
    get:
      tags: [essay]
      operationId: getEssay
      summary: 一篇作文（写作页 5.2、批改中 5.5、批改结果 5.6）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Essay" }
        "404": { $ref: "#/components/responses/NotFound" }

  /essays/{essayId}/draft:
    parameters:
      - $ref: "#/components/parameters/EssayId"
    put:
      tags: [essay]
      operationId: saveEssayDraft
      summary: 保存草稿（每 5 秒）
      description: 不传的字段不改；photo_keys 是 /handwriting/upload-requests 返回的对象键（拍照上传手写稿 5.4）。提交后返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                duration_seconds: { type: integer, minimum: 0 }
                timed: { type: boolean }
                photo_keys: { type: array, items: { type: string }, maxItems: 6 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Essay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /essays/{essayId}/submit:
    parameters:
      - $ref: "#/components/parameters/EssayId"
    post:
      tags: [essay]
      operationId: submitEssay
      summary: 提交批改（5.5）
      description: 按当前评分标准批改，约 30 秒，可先离开，完成后发消息；预占 1 次作文批改（免费版每周 1 篇），批改失败退回。重复提交返回同一结果。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Essay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }

  /essays/{essayId}/dispute:
    parameters:
      - $ref: "#/components/parameters/EssayId"
    post:
      tags: [essay]
      operationId: disputeEssay
      summary: 对作文批改有异议（与主观题相同）
      description: 每篇复核一次，重批不计次，以重批结果为准。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [hit_missed, rubric_wrong, score_unfair, other] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Essay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /subjects/{subjectId}/essays:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [essay]
      operationId: getEssayNotebook
      summary: 作文本（5.8）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EssayNotebook" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/essay-rubrics:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [essay]
      operationId: getEssayRubrics
      summary: 评分标准（5.9）：你的资料与通用标准
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EssayRubrics" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/essay-rubrics/active:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    put:
      tags: [essay]
      operationId: selectEssayRubric
      summary: 切换评分标准（5.9）
      description: 之后新写的作文按它批改，已批改的分数不变。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { $ref: "#/components/schemas/EssayRubricSource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EssayRubrics" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /subjects/{subjectId}/essay-rubrics/user:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    put:
      tags: [essay]
      operationId: updateEssayRubric
      summary: 编辑「你的资料」评分标准（5.9）
      description: 维度、说明、分值与分档；满分 = 各维度分值之和。通用标准不能改（409）。只影响之后的批改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, dimensions]
              properties:
                name: { type: string, maxLength: 64 }
                dimensions: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/EssayDimension" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EssayRubrics" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /model-essays/{modelEssayId}:
    parameters:
      - { name: modelEssayId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [essay]
      operationId: getModelEssay
      summary: 范文详情（5.7）
      description: 只展示用户自己导入的范文；AI 结构拆解（开头立意、分论点、升华、结尾）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelEssayDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/overview:
    get:
      tags: [mine]
      operationId: getMeOverview
      summary: 「我的」页各入口的数字（6.1）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeOverview" }

  /me/redeem:
    post:
      tags: [mine]
      operationId: redeemCode
      summary: 兑换码（6.7）
      description: |
        不区分大小写，空格与连字符会被忽略；一码一次，时长叠加到当前会员之后。
        失败返回 400，detail.reason：invalid 无效 / used 已被使用 / void 已作废 / disabled 已停用 / expired 已过期；
        一小时内失败 10 次后返回 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 32 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedeemResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/survey:
    get:
      tags: [mine]
      operationId: getSurvey
      summary: 考后回访（6.14）
      description: 初试开始后开放；每门课显示考前预估（没有时不返回 low/high，显示「考前没有预估分」）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }
    post:
      tags: [mine]
      operationId: submitSurvey
      summary: 提交考后回访
      description: 第一次提交送 30 天会员（每人一次）；之后再提交只更新复试与录取结果（可稍后补）。初试开始前返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores, retest_result]
              properties:
                scores:
                  type: array
                  items:
                    type: object
                    required: [subject_id, score]
                    properties:
                      subject_id: { type: integer, format: int64 }
                      score: { type: number, minimum: 0 }
                retest_result: { $ref: "#/components/schemas/RetestResult" }
                admission: { $ref: "#/components/schemas/Admission" }
                share_consent: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /feedbacks:
    get:
      tags: [mine]
      operationId: listFeedbacks
      summary: 我的反馈记录（6.13 历史）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Feedback" } }
    post:
      tags: [mine]
      operationId: submitFeedback
      summary: 提交意见反馈（6.13）
      description: 截图用 /handwriting/upload-requests 上传后的对象键，最多 3 张；勾选 allow_access 时客服 72 小时内可查看相关资料，每次查看都会通知你。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ftype, content]
              properties:
                ftype: { $ref: "#/components/schemas/FeedbackType" }
                content: { type: string, minLength: 5, maxLength: 2000 }
                screenshot_keys: { type: array, items: { type: string }, maxItems: 3 }
                allow_access: { type: boolean }
                related_material_id: { type: integer, format: int64 }
      responses:
        "201":
          description: 已提交
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subjects/{subjectId}/export-preview:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [mine]
      operationId: getExportPreview
      summary: 导出题库的可选内容与预计页数（6.4）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPreview" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports:
    post:
      tags: [mine]
      operationId: createExport
      summary: 导出题库（6.4）
      description: 后台生成 PDF 或 Word，只包含本人的内容；生成后用 GET /exports/{exportId} 取 1 小时有效的下载链接，文件 24 小时后删除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, options, format]
              properties:
                subject_id: { type: integer, format: int64 }
                options: { $ref: "#/components/schemas/ExportOptions" }
                format: { type: string, enum: [pdf, docx] }
      responses:
        "202":
          description: 已开始生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/{exportId}:
    parameters:
      - { name: exportId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [mine]
      operationId: getExport
      summary: 导出进度与下载链接
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /membership/plans:
    get:
      tags: [membership]
      operationId: getMembershipCenter
      summary: 会员中心（6.5）
      description: |
        三档会员（冲刺卡、考季卡、月卡）的价格与「现在购买的有效期截止」（叠加到当前会员之后），以及权益对比表。
        payment_enabled 为 false 时 App 隐藏「立即开通」，只显示兑换码入口。会员一次性购买，不自动续费。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipCenter" }

  /orders:
    post:
      tags: [membership]
      operationId: createOrder
      summary: 下单（6.5 立即开通）
      description: |
        受 online_payment 开关控制，关闭时返回 404。返回调起支付所需的参数：微信 prepay（appid、partnerid、prepayid、package、noncestr、timestamp、sign），
        支付宝 order_string；App Store 内购返回 apple_product_id 与 app_account_token，App 用 StoreKit 购买时带上 appAccountToken，
        购买成功后调 apple-verify。同一个 idempotency_key 返回同一个订单。
        失败 400 detail.reason：channel_off / plan_off；409：no_exam_date（初试日期未公布）/ prepay_failed。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, channel]
              properties:
                tier: { $ref: "#/components/schemas/PlanTier" }
                channel: { $ref: "#/components/schemas/PayChannel" }
                idempotency_key: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{orderNo}:
    get:
      tags: [membership]
      operationId: getOrder
      summary: 订单状态（6.6 支付结果轮询）
      description: 支付平台回调到达后 status 变为 paid；App 调起支付返回后轮询几次，仍是 created 时显示「支付结果确认中」。
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{orderNo}/apple-verify:
    post:
      tags: [membership]
      operationId: verifyAppleOrder
      summary: App Store 内购校验并开通
      description: |
        服务端按交易号向 App Store Server API 查询交易，核对 App、商品、appAccountToken 与是否撤销后开通；重复提交返回同一结果。
        失败 400 detail.reason：transaction_not_found / bundle_mismatch / product_mismatch / token_mismatch / revoked；409：transaction_used。
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id: { type: string, maxLength: 128 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /pay/notify/{channel}:
    post:
      tags: [membership]
      operationId: payNotify
      summary: 支付平台异步通知（微信支付、支付宝）
      description: |
        不需要登录，靠渠道签名鉴权：微信 APIv3 平台公钥验签 + AES-256-GCM 解密；支付宝 RSA2 验签。
        应答按渠道格式原样返回（微信 JSON，支付宝纯文本 success / fail）；重复通知只开通一次。
      security: []
      parameters:
        - { name: channel, in: path, required: true, schema: { type: string, enum: [wechat, alipay] } }
      responses:
        "200":
          description: 渠道格式的应答
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/invites:
    get:
      tags: [mine]
      operationId: getInvites
      summary: 邀请研友（6.8）
      description: |
        我的邀请码、奖励规则与邀请记录。好友用邀请码注册（LoginRequest.invite_code）、并导入第一份资料后，双方各得 reward_days 天会员；
        邀请人累计最多 max_days 天。受 invite 开关控制，关闭时返回 404。记录里的好友不显示手机号与昵称。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteOverview" }
        "404": { $ref: "#/components/responses/NotFound" }

  /messages:
    get:
      tags: [today]
      operationId: listMessages
      summary: 消息中心（2.3）
      description: |
        近 30 天的消息，新的在前，每页 30 条。点击按 page 跳转并标已读。page 取值：import_review（params.job_id）、import、today、
        paper_report（session_id）、essay_result（essay_id）、export（job_id）、agreement（kind）、feedback（feedback_id）、member、library；为空时只展示不跳转。
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }

  /messages/unread-count:
    get:
      tags: [today]
      operationId: getUnreadCount
      summary: 未读消息数（首页铃铛红点）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }

  /messages/{messageId}/read:
    post:
      tags: [today]
      operationId: readMessage
      summary: 标为已读
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 已读 }
        "404": { $ref: "#/components/responses/NotFound" }

  /messages/read-all:
    post:
      tags: [today]
