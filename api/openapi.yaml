      tags:
      - admin
      operationId: submitOfficialDraft
      summary: 提交审核
      x-roles: *id004
      security:
      - adminAuth: []
      description: 新编辑前 3 次全量审核，之后 30% 抽检；未抽中的直接通过（mode = skipped）。
      parameters:
      - *id003
      - *id007
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialSubmitResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/official/reviews:
    get:
      tags:
      - admin
      operationId: listOfficialReviews
      summary: 7.13 审核队列
      x-roles: *id002
      security:
      - adminAuth: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficialReview'
  /admin/official/reviews/{reviewId}:
    post:
      tags:
      - admin
      operationId: decideOfficialReview
      summary: 审核：通过、退回、修改后通过
      x-roles: *id002
      security:
      - adminAuth: []
      description: 退回必须填原因；修改后通过要带 edited_payload；不能审核自己提交的。
      parameters:
      - name: reviewId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approved
                  - rejected
                  - edited
                reason:
                  type: string
                  maxLength: 500
                edited_payload: *id008
      responses:
        '204':
          description: 完成
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/official/projects/{projectId}/release-preview:
    get:
      tags:
      - admin
      operationId: previewOfficialRelease
      summary: 7.14 发布预览：变更清单、自动检查、通知预览
      x-roles: *id002
      security:
      - adminAuth: []
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialReleasePreview'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/official/projects/{projectId}/releases:
    get:
      tags:
      - admin
      operationId: listOfficialReleases
      summary: 版本历史
      x-roles:
      - content_lead
      - content_editor
      - analyst
      security:
      - adminAuth: []
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficialVersion'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - admin
      operationId: publishOfficialRelease
      summary: 发布版本
      x-roles: *id002
      security:
      - adminAuth: []
      description: 不填版本号则自动加一（1.0、1.1…）。发布后通知只发给添加了这个官方题库的用户；首次上线另提醒自建了同一专业课的用户。
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                version:
                  type: string
                  maxLength: 16
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/official/projects/{projectId}/releases/{versionId}/rollback:
    post:
      tags:
      - admin
      operationId: rollbackOfficialRelease
      summary: 回滚最新版本
      x-roles: *id002
      security:
      - adminAuth: []
      description: 恢复发布前的内容；用户没改过的副本跟着恢复，掌握度与作答记录保留。
      parameters:
      - *id003
      - name: versionId
        in: path
        required: true
        schema: *id001
      responses:
        '204':
          description: 完成
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminAuth:
      type: http
      scheme: bearer
      description: 后台会话令牌（两步验证后签发，8 小时有效）

  parameters:
    EssayId:
      name: essayId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PaperId:
      name: paperId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GradingId:
      name: gradingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 客户端为每次写操作生成的唯一键（UUID），重试时保持不变
      schema: { type: string, minLength: 8, maxLength: 64 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: 上一页响应里的 next_cursor
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MaterialId:
      name: materialId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    KpId:
      name: kpId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: 参数不正确（BAD_REQUEST）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未登录或令牌失效（UNAUTHORIZED）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 无权操作或账号被封禁（FORBIDDEN）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 不存在、不属于当前用户，或功能开关关闭（NOT_FOUND）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 状态冲突（CONFLICT）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QuotaExceeded:
      description: 额度不足（QUOTA_EXCEEDED），detail.quota_type 为额度类型，App 弹出 4.9 同款弹层
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: 频率限制（TOO_MANY_REQUESTS），detail.retry_after_seconds 为需要等待的秒数
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AIFailed:
      description: AI 生成失败（AI_FAILED），未扣除次数，可重试
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    PaperKind:
      type: string
      description: 真题卷 / AI 标准卷 / AI 针对卷
      enum: [real_exam, ai_standard, ai_targeted]
    PaperMode:
      type: string
      description: 练习模式（可暂停、无提醒）/ 模拟考试（严格计时、不能暂停、到点提醒、时间到自动交卷）
      enum: [practice, mock]
    PaperSessionStatus:
      type: string
      enum: [in_progress, paused, grading, graded, abandoned]
    PaperBrief:
      type: object
      required: [id, kind, title, question_count, full_score, actual_score, duration_minutes, ai_filled, status]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/PaperKind" }
        title: { type: string }
        exam_year: { type: integer }
        question_count: { type: integer }
        full_score: { type: number, description: 整卷满分 }
        actual_score: { type: number, description: 实际收录题目的满分；缺题时小于整卷满分，成绩按比例换算 }
        missing_note: { type: string, description: 缺题说明（资料里缺题时提前说明按多少分计分） }
        duration_minutes: { type: integer }
        ai_filled: { type: integer, description: 用 AI 变式题补足的题数 }
        status: { type: string, enum: [not_started, in_progress, done] }
        session:
          type: object
          description: 进行中的那次
          required: [id, mode, status, answered, total]
          properties:
            id: { type: integer, format: int64 }
            mode: { $ref: "#/components/schemas/PaperMode" }
            status: { $ref: "#/components/schemas/PaperSessionStatus" }
            answered: { type: integer }
            total: { type: integer }
        last:
          type: object
          description: 最近一次完成
          required: [session_id, mode, finished_at]
          properties:
            session_id: { type: integer, format: int64 }
            mode: { $ref: "#/components/schemas/PaperMode" }
            finished_at: { type: string, format: date-time }
            status: { $ref: "#/components/schemas/PaperSessionStatus" }
            score: { type: number }
            full_score: { type: number }
    PaperList:
      type: object
      required: [real_exam, ai_papers, weekly_remaining]
      properties:
        real_exam: { type: array, items: { $ref: "#/components/schemas/PaperBrief" } }
        ai_papers: { type: array, items: { $ref: "#/components/schemas/PaperBrief" } }
        weekly_remaining: { type: integer, nullable: true, description: 本周还能批改几套整卷，null 为不限 }
        in_progress:
          type: object
          required: [session_id, paper_id, title, subject_id]
          properties:
            session_id: { type: integer, format: int64 }
            paper_id: { type: integer, format: int64 }
            title: { type: string }
            subject_id: { type: integer, format: int64 }
    PaperSection:
      type: object
      required: [qtype, count, score_each, total, suggested_minutes]
      properties:
        qtype: { $ref: "#/components/schemas/QuestionType" }
        count: { type: integer }
        score_each: { type: number }
        total: { type: number }
        suggested_minutes: { type: integer }
    PaperDetail:
      allOf:
        - $ref: "#/components/schemas/PaperBrief"
        - type: object
          required: [sections, check_minutes, recommended_mode, counts_for_estimate]
          properties:
            sections: { type: array, items: { $ref: "#/components/schemas/PaperSection" } }
            check_minutes: { type: integer, description: 留给检查的时间 }
            recommended_mode: { $ref: "#/components/schemas/PaperMode" }
            counts_for_estimate: { type: boolean, description: 做完计入预估分（只有导入的真题卷） }
    PaperItem:
      type: object
      required: [seq, section, qtype, score, question_id, stem, marked, answered, time_spent_seconds]
      properties:
        seq: { type: integer }
        section: { type: string }
        qtype: { $ref: "#/components/schemas/QuestionType" }
        score: { type: number }
        question_id: { type: integer, format: int64 }
        stem: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" } }
        origin_tags: { type: array, items: { type: string } }
        draft_text: { type: string }
        marked: { type: boolean }
        answered: { type: boolean }
        time_spent_seconds: { type: integer }
        required_words: { type: integer }
        got: { type: number, description: 批改后的得分 }
        grading_id: { type: integer, format: int64 }
    PaperReminder:
      type: object
      required: [qtype, at_minutes, suggested_minutes, text]
      properties:
        qtype: { $ref: "#/components/schemas/QuestionType" }
        at_minutes: { type: integer, description: 开考后第几分钟提醒（这一题型的累计建议用时） }
        suggested_minutes: { type: integer }
        text: { type: string }
    PaperSession:
      type: object
      required: [id, paper_id, subject_id, title, kind, mode, status, started_at, server_now, elapsed_seconds, total_minutes, check_minutes, remind_left_minutes, reminders, items, resume_available, full_score]
      properties:
        id: { type: integer, format: int64 }
        paper_id: { type: integer, format: int64 }
        subject_id: { type: integer, format: int64 }
        title: { type: string }
        kind: { $ref: "#/components/schemas/PaperKind" }
        mode: { $ref: "#/components/schemas/PaperMode" }
        status: { $ref: "#/components/schemas/PaperSessionStatus" }
        started_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time, description: 模拟考试的截止时间，倒计时以它为准 }
        server_now: { type: string, format: date-time, description: 服务端当前时间，客户端据此校准倒计时 }
        elapsed_seconds: { type: integer, description: 已用时间（扣除暂停） }
        total_minutes: { type: integer }
