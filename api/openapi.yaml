      required:
      - id
      - draft_id
      - project_id
      - editor_id
      - mode
      - entity_type
      - change_type
      - payload
      - created_at
      properties:
        id: *id003
        draft_id: *id003
        project_id: *id003
        editor_id: *id003
        mode: *id001
        entity_type: *id001
        entity_id: *id003
        change_type: *id001
        payload: *id005
        before: *id005
        created_at: *id006
    OfficialChange:
      type: object
      required:
      - draft_id
      - entity_type
      - change_type
      - entity_id
      - title
      - rubric_changed
      properties:
        draft_id: *id003
        entity_type: *id001
        change_type: *id001
        entity_id: *id003
        title: *id001
        rubric_changed: *id007
    OfficialCheck:
      type: object
      required:
      - name
      - passed
      properties:
        name: *id001
        passed: *id007
        detail: *id001
    OfficialReleasePreview:
      type: object
      required:
      - changes
      - checks
      - next_version
      - notice
      - subscribers
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/OfficialChange'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/OfficialCheck'
        next_version: *id001
        notice: *id001
        subscribers: *id002
    OfficialVersion:
      type: object
      required:
      - id
      - version
      - changes
      - published_at
      properties:
        id: *id003
        version: *id001
        changes:
          type: array
          items:
            $ref: '#/components/schemas/OfficialChange'
        published_at: *id006
        rolled_back_at: *id006
    RedeemResult:
      type: object
      required: [tier, days, starts_at, ends_at, membership]
      properties:
        tier: { type: string, enum: [sprint, season, monthly, gift] }
        days: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        membership: { $ref: "#/components/schemas/MembershipStatus" }
    RetestResult:
      type: string
      description: 进复试 / 没进 / 还不知道
      enum: [in, out, unknown]
    Admission:
      type: string
      description: 已录取 / 调剂 / 未录取 / 待定
      enum: [admitted, adjusted, rejected, pending]
    Survey:
      type: object
      required: [open, exam_year, submitted, reward_days, subjects, share_consent]
      properties:
        open: { type: boolean, description: 初试开始后开放 }
        exam_year: { type: integer }
        submitted: { type: boolean }
        reward_days: { type: integer }
        subjects: { type: array, items: { $ref: "#/components/schemas/SurveySubject" } }
        retest_result: { $ref: "#/components/schemas/RetestResult" }
        admission: { $ref: "#/components/schemas/Admission" }
        share_consent: { type: boolean }
    SurveySubject:
      type: object
      required: [subject_id, name, full_score]
      properties:
        subject_id: { type: integer, format: int64 }
        name: { type: string }
        full_score: { type: integer }
        low: { type: integer, description: 考前预估下限；没有预估分时不返回 }
        high: { type: integer }
        actual: { type: number, description: 已填的实际成绩 }
    FeedbackType:
      type: string
      description: 功能建议 / 识别不准 / 批改不准 / 出现问题 / 侵权投诉
      enum: [suggestion, recognition, grading, bug, infringement]
    Feedback:
      type: object
      required: [id, ftype, content, screenshot_keys, allow_access, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        ftype: { $ref: "#/components/schemas/FeedbackType" }
        content: { type: string }
        screenshot_keys: { type: array, items: { type: string } }
        allow_access: { type: boolean }
        status: { type: string, enum: [open, replied, closed] }
        reply: { type: string }
        replied_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ExportOptions:
      type: object
      required: [questions, kps, wrong, ai_variants]
      properties:
        questions: { type: boolean, description: 题目和参考答案 }
        kps: { type: boolean, description: 知识点卡片 }
        wrong: { type: boolean, description: 错题和我的作答（附失分原因） }
        ai_variants: { type: boolean, description: AI 出的变式题（默认不勾，会标「AI 出题」） }
    ExportItem:
      type: object
      required: [count, pages]
      properties:
        count: { type: integer }
        pages: { type: integer, description: 预计页数 }
    ExportPreview:
      type: object
      required: [subject_id, questions, kps, wrong, ai_variants]
      properties:
        subject_id: { type: integer, format: int64 }
        questions: { $ref: "#/components/schemas/ExportItem" }
        kps: { $ref: "#/components/schemas/ExportItem" }
        wrong: { $ref: "#/components/schemas/ExportItem" }
        ai_variants: { $ref: "#/components/schemas/ExportItem" }
    ExportJob:
      type: object
      required: [id, subject_id, format, options, status, pages, file_name, created_at]
      properties:
        id: { type: integer, format: int64 }
        subject_id: { type: integer, format: int64 }
        format: { type: string, enum: [pdf, docx] }
        options: { $ref: "#/components/schemas/ExportOptions" }
        status: { type: string, enum: [queued, running, done, failed, expired], description: expired = 已超过 24 小时，文件已删除 }
        pages: { type: integer }
        file_name: { type: string }
        download_url: { type: string, description: 1 小时有效的下载链接（status=done 时） }
        expires_at: { type: string, format: date-time, description: 文件删除时间 }
        created_at: { type: string, format: date-time }
    ExamProfile:
      type: object
      required: [ready, paper_count, min_papers, years, excluded_count, structure, sections, high_freq, missing_sections, style_tags, basis]
      properties:
        ready: { type: boolean, description: 至少 2 套真题卷才显示统计 }
        paper_count: { type: integer }
        min_papers: { type: integer }
        years: { type: array, items: { type: integer } }
        excluded_count: { type: integer, description: 回忆版、缺分值等未计入的题数 }
        structure:
          type: array
          description: 题型结构与建议用时（PRD 11.9 同一套数字）
          items:
            type: object
            required: [qtype, count, score_each, total, suggested_minutes]
            properties:
              qtype: { $ref: "#/components/schemas/QuestionType" }
              count: { type: integer }
              score_each: { type: number }
              total: { type: number }
              suggested_minutes: { type: integer }
        stable_years: { type: integer, description: 「近 N 年未变」 }
        changed_years: { type: array, items: { type: integer }, description: 近 3 年里结构不同的年份 }
        total_minutes: { type: integer }
        check_minutes: { type: integer }
        sections:
          type: array
          description: 板块分值占比与掌握度
          items:
            type: object
            required: [id, name, share, mastery, kp_count]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              share: { type: number, description: 0–1 }
              mastery: { type: number, description: 0–100 }
              kp_count: { type: integer }
        high_freq:
          type: array
          items:
            type: object
            required: [kp_id, name, path, exam_count, state]
            properties:
              kp_id: { type: integer, format: int64 }
              name: { type: string }
              path: { type: array, items: { type: string } }
              exam_count: { type: integer }
              state: { $ref: "#/components/schemas/MasteryState" }
        high_freq_total: { type: integer, description: 真题考过的知识点总数 }
        missing_sections:
          type: array
          description: 缺资料提醒
          items:
            type: object
            required: [id, name, share, kp_count, mastery]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              share: { type: number }
              kp_count: { type: integer }
              mastery: { type: number }
        style_tags: { type: array, items: { type: string }, description: 出题风格（AI 统计） }
        basis:
          type: array
          description: 依据的资料
          items:
            type: object
            required: [material_id, file_name]
            properties:
              material_id: { type: integer, format: int64 }
              file_name: { type: string }
    RelationType:
      type: string
      description: 易混对比 / 组成要素 / 同章并列 / 相关
      enum: [contrast, component, sibling, related]
    KnowledgeRelation:
      type: object
      required: [id, source_id, target_id, relation_type, origin]
      properties:
        id: { type: integer, format: int64 }
        source_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        relation_type: { $ref: "#/components/schemas/RelationType" }
        origin: { $ref: "#/components/schemas/Origin" }
    KnowledgeGraph:
      type: object
      required: [sections, nodes, edges]
      properties:
        sections:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        nodes:
          type: array
          items:
            type: object
            required: [id, name, section_id, state, m, exam_count]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              section_id: { type: integer, format: int64 }
              state: { $ref: "#/components/schemas/MasteryState" }
              m: { type: number }
              exam_count: { type: integer }
        edges: { type: array, items: { $ref: "#/components/schemas/KnowledgeRelation" } }
    EssayKnowledgeBase:
      type: object
      required: [methods, materials, model_essays, topics]
      properties:
        rubric:
          type: object
          required: [id, name, full_score, source, dimensions]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            full_score: { type: number }
            source: { type: string, enum: [user_material, generic] }
            source_ref: { $ref: "#/components/schemas/SourceRef" }
            dimensions:
              type: array
              items:
                type: object
                required: [name, score]
                properties:
                  name: { type: string }
                  description: { type: string }
                  score: { type: number }
        methods:
          type: array
          items:
            type: object
            required: [id, title, content, origin, state]
            properties:
              id: { type: integer, format: int64 }
              title: { type: string }
              content: { type: string }
              dimension: { type: string }
              origin: { $ref: "#/components/schemas/Origin" }
              state: { $ref: "#/components/schemas/MasteryState" }
              source: { $ref: "#/components/schemas/SourceRef" }
        materials:
          type: array
          description: 素材按主题分组；origin=ai_generated 显示「AI 补充」
          items:
            type: object
            required: [id, theme, content, origin, favorite, exam_count]
            properties:
              id: { type: integer, format: int64 }
              theme: { type: string }
              content: { type: string }
              origin: { $ref: "#/components/schemas/Origin" }
              favorite: { type: boolean }
              exam_count: { type: integer }
              source: { $ref: "#/components/schemas/SourceRef" }
        model_essays:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: integer, format: int64 }
              title: { type: string }
              topic_question_id: { type: integer, format: int64 }
              topic: { type: string }
              structure:
                type: object
                properties:
                  opening: { type: string }
                  points: { type: array, items: { type: string } }
                  elevation: { type: string }
                  ending: { type: string }
              source: { $ref: "#/components/schemas/SourceRef" }
        topics:
          type: array
          description: 作文题（来自导入的作文真题），按年份
          items:
            type: object
            required: [id, stem, model_essay_count]
            properties:
              id: { type: integer, format: int64 }
              stem: { type: string }
              exam_year: { type: integer }
              required_words: { type: integer }
              model_essay_count: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读的错误码（internal/http/errors.go）：BAD_REQUEST、UNAUTHORIZED、FORBIDDEN、NOT_FOUND、CONFLICT、
            TOO_MANY_REQUESTS、QUOTA_EXCEEDED、AI_FAILED、INTERNAL、SERVICE_UNAVAILABLE、NOT_IMPLEMENTED
          example: NOT_FOUND
        message: { type: string, description: 面向用户的简体中文说明, example: 内容不存在 }
        detail:
          type: object
          additionalProperties: true
          description: 补充信息（如 remaining_attempts、retry_after_seconds、quota_type、reason）

    Health:
      type: object
      required: [status, version, mysql, redis]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        version: { type: string, description: 构建版本号, example: v0.1.0 }
        mysql: { $ref: "#/components/schemas/HealthStatus" }
        redis: { $ref: "#/components/schemas/HealthStatus" }
    HealthStatus:
      type: string
      enum: [ok, error]

    Platform:
      type: string
      enum: [ios, android]

    Origin:
      type: string
      description: 内容来源，界面据此标注（PRD 2.3「标明来源」）
      enum: [user_confirmed, ai_extracted, ai_generated, imported, official]

    FeatureFlags:
      type: object
      required: [flags]
      properties:
        flags:
          type: object
          description: 开关名 → 是否对当前用户打开。online_payment、official_bank、oral_recite、voice_answer、scanned_pdf、invite
          additionalProperties: { type: boolean }

    AppUpdate:
      type: object
      required: [latest_version, min_version, download_url, force]
      properties:
        latest_version: { type: string }
        min_version: { type: string }
        download_url: { type: string, description: 内测期安卓为安装包地址、iOS 为 TestFlight }
        release_notes: { type: string }
        force: { type: boolean, description: 当前版本低于最低版本，强制更新（0.6b） }
        has_update: { type: boolean, description: 有新版本（0.6，每个版本提示一次由客户端记录） }

    Bootstrap:
      type: object
      required: [server_time, flags, app_name]
      properties:
        server_time: { type: string, format: date-time }
        app_name: { type: string, description: App 显示名，由配置读取, example: 考研Training }
        update: { $ref: "#/components/schemas/AppUpdate" }
        flags:
          type: object
          additionalProperties: { type: boolean }
        agreements_to_accept:
          type: array
          description: 已登录用户需要重新同意的协议（0.4b）；为空或缺省表示不需要
          items: { $ref: "#/components/schemas/AgreementSummary" }
        logged_in: { type: boolean }
        onboarding_step: { type: string, description: 已登录用户的引导进度；done 表示已完成 }

    SmsPurpose:
      type: string
      enum: [login, change_phone_old, change_phone_new]
    SendSmsCodeRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { type: string, pattern: "^1[3-9][0-9]{9}$", description: 11 位手机号 }
        purpose: { $ref: "#/components/schemas/SmsPurpose" }
        agree: { type: boolean, description: purpose=login 时必须为 true }
    SendSmsCodeResponse:
      type: object
      required: [resend_after_seconds, remaining_today]
      properties:
        resend_after_seconds: { type: integer, example: 60 }
        remaining_today: { type: integer, description: 今天还能发几次 }

    DeviceInfo:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string, minLength: 8, maxLength: 64 }
        device_name: { type: string, maxLength: 64, example: iPhone 15 }
        platform: { type: string, enum: [ios, android, web] }
    LoginRequest:
      type: object
      required: [phone, code, device]
      properties:
        phone: { type: string, pattern: "^1[3-9][0-9]{9}$" }
        code: { type: string, pattern: "^[0-9]{6}$" }
        device: { $ref: "#/components/schemas/DeviceInfo" }
        invite_code: { type: string, description: 被邀请时填写（邀请开关打开后生效） }
    TokenPair:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user, is_new_user]
          properties:
            user: { $ref: "#/components/schemas/Me" }
            is_new_user: { type: boolean, description: true 进入 1.1；false 进入 2.1 或中断的引导步骤 }
            deletion_canceled: { type: boolean, description: 本次登录撤销了注销申请 }
    RefreshRequest:
      type: object
      required: [refresh_token, device_id]
      properties:
        refresh_token: { type: string }
        device_id: { type: string }

    AgreementKind:
      type: string
      enum: [user, privacy, membership]
    AgreementSummary:
      type: object
      required: [id, kind, version, title]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/AgreementKind" }
        version: { type: string }
        title: { type: string }
        change_summary: { type: string }
    Agreement:
      allOf:
        - $ref: "#/components/schemas/AgreementSummary"
        - type: object
          required: [body, effective_at, updated_at]
          properties:
            body: { type: string, description: 正文（Markdown） }
            effective_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    MembershipStatus:
      type: object
      required: [is_member]
      properties:
        is_member: { type: boolean }
        tier: { type: string, enum: [sprint, season, monthly, gift] }
        ends_at: { type: string, format: date-time }
    Me:
      type: object
      required: [id, phone_masked, nickname, invite_code, onboarding_step, membership]
      properties:
        id: { type: integer, format: int64 }
        phone_masked: { type: string, example: 138****5678 }
        nickname: { type: string }
        avatar_url: { type: string }
        invite_code: { type: string }
        onboarding_step:
          type: string
          description: 引导中断的步骤（1.1–1.8）；done 表示已完成
          example: done
        membership: { $ref: "#/components/schemas/MembershipStatus" }
        deletion_due_at: { type: string, format: date-time, description: 注销冷静期结束时间；为空表示没有注销申请 }
    UpdateMeRequest:
      type: object
      properties:
        nickname: { type: string, minLength: 1, maxLength: 16 }
        onboarding_step: { type: string, enum: ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", done] }
    Device:
      type: object
      required: [device_id, device_name, platform, last_used_at, current]
      properties:
        device_id: { type: string }
        device_name: { type: string }
        platform: { type: string, enum: [ios, android, web] }
        last_used_at: { type: string, format: date-time }
        current: { type: boolean, description: 是否本机 }
    ChangePhoneRequest:
      type: object
      required: [old_code, new_phone, new_code]
      properties:
        old_code: { type: string, pattern: "^[0-9]{6}$" }
        new_phone: { type: string, pattern: "^1[3-9][0-9]{9}$" }
        new_code: { type: string, pattern: "^[0-9]{6}$" }

    Stage:
      type: string
      description: 基础期 / 强化期 / 冲刺期 / 考前期
      enum: [foundation, strengthen, sprint, final]
    ExamYear:
      type: object
      required: [exam_year, label, first_exam_start, first_exam_end, subject_exam_date, days_to_exam, suggested_stage]
      properties:
        days_to_exam: { type: integer, description: 距专业课考试天数（1.3 大数字） }
        suggested_stage: { $ref: "#/components/schemas/Stage" }
        exam_year: { type: integer, example: 2027 }
        label: { type: string, example: 2027 研考 · 今年 12 月初试 }
        first_exam_start: { type: string, format: date }
        first_exam_end: { type: string, format: date }
        subject_exam_date: { type: string, format: date, description: 专业课考试日，倒计时以它为准 }
    StudyProfileInput:
      type: object
      required: [exam_year, stage, daily_minutes]
      properties:
        exam_year: { type: integer }
        stage: { $ref: "#/components/schemas/Stage" }
        stage_manual: { type: boolean, description: 用户手动改了系统推荐的阶段 }
        daily_minutes: { type: integer, enum: [30, 45, 60, 90] }
        reminder_times:
          type: array
          maxItems: 3
          items: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        target_school_major: { type: string, maxLength: 64, nullable: true }
        essay_weekly_goal: { type: integer, minimum: 0, maximum: 14 }
        mock_time_reminders: { type: boolean }
        notify_daily: { type: boolean }
        notify_review_due: { type: boolean }
        notify_task_done: { type: boolean }
    StudyProfile:
      type: object
      required: [exam_year, stage, stage_manual, suggested_stage, days_to_exam, subject_exam_date, daily_minutes, reminder_times, essay_weekly_goal, mock_time_reminders, notify_daily, notify_review_due, notify_task_done]
      properties:
        exam_year: { type: integer }
        stage: { $ref: "#/components/schemas/Stage" }
        stage_manual: { type: boolean }
        suggested_stage: { $ref: "#/components/schemas/Stage" }
        suggested_reason: { type: string, description: 系统建议的理由（6.9） }
        days_to_exam: { type: integer, description: 距专业课考试天数 }
        subject_exam_date: { type: string, format: date }
        daily_minutes: { type: integer }
        pending_stage: { $ref: "#/components/schemas/Stage" }
        pending_daily_minutes: { type: integer }
        pending_effective_on: { type: string, format: date, description: 待生效的修改从这天起生效 }
        reminder_times: { type: array, items: { type: string } }
        target_school_major: { type: string }
        essay_weekly_goal: { type: integer }
        mock_time_reminders: { type: boolean }
        notify_daily: { type: boolean }
        notify_review_due: { type: boolean }
        notify_task_done: { type: boolean }

    SubjectInput:
      type: object
      required: [name, full_score]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        code: { type: string, maxLength: 16, nullable: true }
        full_score: { type: integer, enum: [100, 150, 300] }
        target_score: { type: integer, minimum: 0, nullable: true, description: 不设目标传 null }
    SubjectPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        code: { type: string, maxLength: 16, nullable: true }
        full_score: { type: integer, enum: [100, 150, 300] }
        target_score: { type: integer, minimum: 0, nullable: true }
        is_essay: { type: boolean, description: 用户纠正作文课判断（1.7），之后不再自动改 }
    Subject:
      type: object
      required: [id, name, full_score, is_essay, bank_id, question_count, kp_count, material_count]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string }
        full_score: { type: integer }
        target_score: { type: integer }
        is_essay: { type: boolean, description: 作文课（如 908），题库页显示为 3.10 }
        bank_id: { type: integer, format: int64 }
        question_count: { type: integer }
        kp_count: { type: integer }
        material_count: { type: integer }
    SubjectList:
      type: object
      required: [items, max_subjects, can_add]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Subject" } }
        max_subjects: { type: integer, description: 当前身份最多几门（免费 3、会员 4） }
        can_add: { type: boolean }

    QuotaType:
      type: string
      enum: [parse_pages, import_questions, grading, ai_questions, paper_grading, essay_grading, subjects]
    QuotaItem:
      type: object
      required: [quota_type, used, period]
      properties:
        quota_type: { $ref: "#/components/schemas/QuotaType" }
        used: { type: integer }
        limit: { type: integer, nullable: true, description: 为空表示不限 }
        period: { type: string, enum: [total, monthly, daily, weekly], description: 重置周期 }
        resets_at: { type: string, format: date-time, description: 下次重置时间；累计额度为空 }
    QuotaSummary:
      type: object
      required: [membership, items]
      properties:
        membership: { $ref: "#/components/schemas/MembershipStatus" }
        items: { type: array, items: { $ref: "#/components/schemas/QuotaItem" } }

    MaterialCategory:
      type: string
      description: 题目类 / 参考类 / 作文类
      enum: [question, reference, essay]
    MaterialFormat:
      type: string
      enum: [docx, xlsx, pdf, image, text]
    MaterialStatus:
      type: string
      enum: [uploading, uploaded, parsing, parsed, partial, failed, rejected]
    Material:
      type: object
      required: [id, subject_id, file_name, format, status, page_count, billed_pages, question_count, kp_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        subject_id: { type: integer, format: int64 }
        category: { $ref: "#/components/schemas/MaterialCategory" }
        sub_type: { type: string, description: 真题汇编、习题集、参考书、讲义、笔记、作文真题、范文、写作笔记、评分细则 }
        file_name: { type: string }
        format: { $ref: "#/components/schemas/MaterialFormat" }
        status: { $ref: "#/components/schemas/MaterialStatus" }
        fail_reason: { type: string }
        page_count: { type: integer }
        billed_pages: { type: integer }
        question_count: { type: integer }
        kp_count: { type: integer }
        paper_count: { type: integer, description: 组成的真题卷数（6.3） }
        needs_review_count: { type: integer }
        incomplete: { type: boolean, description: 识别不完整，提醒用户 }
        created_at: { type: string, format: date-time }
    UploadFile:
      type: object
      required: [file_name, format, size_bytes, sha256]
      properties:
        file_name: { type: string, maxLength: 255 }
        format: { $ref: "#/components/schemas/MaterialFormat" }
        size_bytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        page_count: { type: integer, minimum: 1, description: 客户端已知的页数（PDF）；服务端会复核 }
        content_type: { type: string, example: application/pdf }
    UploadRequest:
      type: object
      required: [subject_id, files, right_confirmed]
      properties:
        subject_id: { type: integer, format: int64 }
        category: { $ref: "#/components/schemas/MaterialCategory" }
        files: { type: array, minItems: 1, maxItems: 30, items: { $ref: "#/components/schemas/UploadFile" } }
        right_confirmed: { type: boolean, description: 「我确认对这些资料有合法的使用权，仅用于本人学习」，必须为 true }
    UploadTarget:
      type: object
      required: [index, material_id]
      properties:
        index: { type: integer, description: 对应请求 files 的下标 }
        material_id: { type: integer, format: int64 }
        upload_url: { type: string, description: OSS 预签名 PUT 地址；重复文件为空 }
        upload_headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
        duplicate: { type: boolean, description: 已上传过相同内容的文件，material_id 指向它，不需要上传 }
    UploadRequestResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/UploadTarget" } }
    PasteMaterialRequest:
      type: object
      required: [subject_id, text, right_confirmed]
      properties:
        subject_id: { type: integer, format: int64 }
        category: { $ref: "#/components/schemas/MaterialCategory" }
        title: { type: string, maxLength: 64 }
        text: { type: string, minLength: 1, maxLength: 20000 }
        right_confirmed: { type: boolean }

    ImportMode:
      type: string
      description: 1.4 选的导入方式：题目 / 资料（拆成知识点） / 作文资料
      enum: [question, reference, essay]
    CreateImportJobRequest:
      type: object
      required: [subject_id, mode, material_ids]
      properties:
        subject_id: { type: integer, format: int64 }
        mode: { $ref: "#/components/schemas/ImportMode" }
        material_ids: { type: array, minItems: 1, maxItems: 30, items: { type: integer, format: int64 } }
    ImportStep:
      type: string
      description: 识别文字 · 拆分题目 · 配答案和采分点（1.6）
      enum: [queued, extract, moderate, split, structure, match, rubric, tag, dedupe, done]
    ImportJobMaterial:
      type: object
      required: [material_id, file_name, step, status]
      properties:
        material_id: { type: integer, format: int64 }
        file_name: { type: string }
        step: { $ref: "#/components/schemas/ImportStep" }
        status: { type: string, enum: [pending, running, done, partial, failed] }
        fail_reason: { type: string, description: 如「照片模糊」「只识别出 4 题」 }
        recognized_count: { type: integer }
        eta_seconds: { type: integer }
    ImportJob:
      type: object
      required: [id, subject_id, mode, status, materials, reserved_pages, counts, created_at]
      properties:
        id: { type: integer, format: int64 }
        subject_id: { type: integer, format: int64 }
        mode: { $ref: "#/components/schemas/ImportMode" }
        status: { type: string, enum: [queued, running, reviewing, confirmed, failed, canceled] }
        materials: { type: array, items: { $ref: "#/components/schemas/ImportJobMaterial" } }
        reserved_pages: { type: integer }
        billed_pages: { type: integer }
        eta_seconds: { type: integer, description: 预计剩余时间 }
        detected_essay: { type: boolean, description: AI 判断这批资料是作文类（1.7 显示，可改） }
        counts: { $ref: "#/components/schemas/ImportCounts" }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ImportCounts:
      type: object
      required: [questions, knowledge_points, needs_review, subjective, objective, confirmed]
      properties:
        questions: { type: integer }
        knowledge_points: { type: integer }
        needs_review: { type: integer }
        subjective: { type: integer }
        objective: { type: integer }
        confirmed: { type: integer }
        essay_items: { type: integer, description: 作文资料条目（评分标准、写作方法、素材、范文） }

    ReviewReason:
      type: string
      enum: [low_confidence, missing_answer, rubric_unconfirmed, rubric_sum_mismatch, duplicate]
    ImportItemStatus:
      type: string
      enum: [pending, confirmed, edited, deleted]
    ImportItemType:
      type: string
      enum: [question, knowledge_point, essay_topic, essay_rubric, writing_method, essay_material, model_essay]
    SourceRef:
      type: object
      description: 出处：文件 + 页码
      required: [material_id, file_name]
      properties:
        material_id: { type: integer, format: int64 }
        file_name: { type: string }
        page: { type: integer }
    RubricPointInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        score: { type: number, minimum: 0 }
        keywords: { type: array, items: { type: string } }
    RubricPoint:
      type: object
      required: [id, seq, content, origin]
      properties:
        id: { type: integer, format: int64 }
        seq: { type: integer }
        content: { type: string }
        score: { type: number }
        keywords: { type: array, items: { type: string } }
        origin: { $ref: "#/components/schemas/Origin" }
    QuestionDraft:
      type: object
      description: 待确认题目的内容（import_items.payload）
      required: [qtype, stem]
      properties:
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" } }
        answer: { type: string }
        answer_origin: { $ref: "#/components/schemas/Origin" }
        analysis: { type: string }
        score: { type: number }
        source: { $ref: "#/components/schemas/QuestionSource" }
        exam_year: { type: integer }
        question_no: { type: string }
        is_recollection: { type: boolean }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPointInput" } }
        rubric_origin: { $ref: "#/components/schemas/Origin" }
        kp_path: { type: array, items: { type: string }, description: 板块 / 章节 / 知识点名称 }
        kp_id: { type: integer, format: int64, description: 用户改了归属时指向已有知识点 }
    KnowledgePointDraft:
      type: object
      required: [name, kp_path]
      properties:
        name: { type: string }
        original_text: { type: string }
        kp_path: { type: array, items: { type: string } }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPointInput" } }
    ImportItem:
      type: object
      required: [id, job_id, item_type, status, needs_review, review_reasons]
      properties:
        id: { type: integer, format: int64 }
        job_id: { type: integer, format: int64 }
        item_type: { $ref: "#/components/schemas/ImportItemType" }
        status: { $ref: "#/components/schemas/ImportItemStatus" }
        needs_review: { type: boolean }
        review_reasons: { type: array, items: { $ref: "#/components/schemas/ReviewReason" } }
        confidence: { type: number }
        source: { $ref: "#/components/schemas/SourceRef" }
        question: { $ref: "#/components/schemas/QuestionDraft" }
        knowledge_point: { $ref: "#/components/schemas/KnowledgePointDraft" }
        essay:
          type: object
          additionalProperties: true
          description: 作文资料条目内容（评分标准、写作方法、素材、范文），结构见 T11
        duplicate_of_question_id: { type: integer, format: int64, description: 疑似重复的已有题目 }
    ImportItemPatch:
      type: object
      properties:
        status: { type: string, enum: [confirmed, deleted, pending] }
        question: { $ref: "#/components/schemas/QuestionDraft" }
        knowledge_point: { $ref: "#/components/schemas/KnowledgePointDraft" }
        essay:
          type: object
          additionalProperties: true
    ImportItemPage:
      type: object
      required: [items, counts]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportItem" } }
        counts: { $ref: "#/components/schemas/ImportCounts" }
        next_cursor: { type: string }
    ConfirmImportResult:
      type: object
      required: [question_count, kp_count, needs_review_count, plan_ready]
      properties:
        question_count: { type: integer }
        kp_count: { type: integer }
        needs_review_count: { type: integer }
        paper_count: { type: integer, description: 按年份组成的真题卷数 }
        plan_ready: { type: boolean, description: 今日计划已生成（1.8） }
        subjects_without_import:
          type: array
          description: 还没导入的专业课，1.8 提示继续导入
          items: { type: integer, format: int64 }

    MasteryState:
      type: string
      description: 未学习 / 学习中 / 待巩固 / 已掌握
      enum: [unlearned, learning, consolidating, mastered]
    SelfAssessLevel:
      type: string
      description: 不会 / 模糊 / 掌握
      enum: [unknown, vague, mastered]
    Mastery:
      type: object
      required: [m, state]
      properties:
        m: { type: number, description: 掌握分 0–100 }
        state: { $ref: "#/components/schemas/MasteryState" }
        next_review_on: { type: string, format: date }
        last_self_assess: { $ref: "#/components/schemas/SelfAssessLevel" }
    KnowledgeLevel:
      type: string
      enum: [section, chapter, point]
    KnowledgeNode:
      type: object
      required: [id, level, name, children]
      properties:
        id: { type: integer, format: int64 }
        level: { $ref: "#/components/schemas/KnowledgeLevel" }
        name: { type: string }
        kp_count: { type: integer, description: 板块与章节：知识点数 }
        consolidating_count: { type: integer, description: 板块与章节：待巩固数 }
        avg_mastery: { type: number, description: 板块：平均掌握度 0–100 }
        is_weak: { type: boolean, description: 板块掌握度低于 40%，标「短板」 }
        exam_count: { type: integer, description: 知识点：真题出现次数 }
        state: { $ref: "#/components/schemas/MasteryState" }
        needs_review: { type: boolean }
        official: { type: boolean, description: 来自官方题库 }
        is_new: { type: boolean, description: 官方题库新版本新增的知识点，标「新」两周 }
        children: { type: array, items: { $ref: "#/components/schemas/KnowledgeNode" } }
    KnowledgeNodeInput:
      type: object
      required: [level, name]
      properties:
        level: { $ref: "#/components/schemas/KnowledgeLevel" }
        name: { type: string, minLength: 1, maxLength: 128 }
        parent_id: { type: integer, format: int64, nullable: true }
        original_text: { type: string }
    QuestionBrief:
      type: object
      required: [id, qtype, stem, source]
      properties:
        id: { type: integer, format: int64 }
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string }
        source: { $ref: "#/components/schemas/QuestionSource" }
        exam_year: { type: integer }
    KnowledgePointDetail:
      type: object
      required: [id, level, name, origin, path, mastery, exam_count, rubric_points, related_questions, needs_review]
      properties:
        id: { type: integer, format: int64 }
        level: { $ref: "#/components/schemas/KnowledgeLevel" }
        name: { type: string }
        path: { type: array, items: { type: string }, description: 板块 / 章节 }
        parent_id: { type: integer, format: int64 }
        original_text: { type: string, description: 原文表述，采分关键词由 rubric_points.keywords 标出 }
        source: { $ref: "#/components/schemas/SourceRef" }
        origin: { $ref: "#/components/schemas/Origin" }
        exam_count: { type: integer }
        mastery: { $ref: "#/components/schemas/Mastery" }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPoint" } }
        ai_explanation: { type: string, description: AI 解读，标「AI 生成」 }
        related_questions: { type: array, items: { $ref: "#/components/schemas/QuestionBrief" } }
        needs_review: { type: boolean }
        official: { type: boolean }
    KnowledgePointPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        original_text: { type: string }
        parent_id: { type: integer, format: int64 }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPointInput" } }
        needs_review: { type: boolean, description: 传 false 表示核对完成 }

    QuestionType:
      type: string
      description: |
        single_choice 单选、multi_choice 多选、true_false 判断、fill_blank 填空、term 名词解释、short_answer 简答、
        discussion 论述、essay 作文、calculation 计算（只能自评）、other 其他
      enum: [single_choice, multi_choice, true_false, fill_blank, term, short_answer, discussion, essay, calculation, other]
    QuestionSource:
      type: string
      description: 真题 / 习题 / AI 出题 / 官方
      enum: [exam, exercise, ai_generated, official]
    ChoiceOption:
      type: object
      required: [key, text]
      properties:
        key: { type: string, example: A }
        text: { type: string }
    QuestionStatusTag:
      type: string
      description: 已掌握 / 错题 / 待核对 / 还没做过 / 已做过
      enum: [mastered, wrong, needs_review, unanswered, answered]
    QuestionSummary:
      type: object
      required: [id, qtype, stem, source, status_tag, attempt_count, path]
      properties:
        id: { type: integer, format: int64 }
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string, description: 题干（列表中截断到 120 字） }
        score: { type: number }
        source: { $ref: "#/components/schemas/QuestionSource" }
        exam_year: { type: integer }
        status_tag: { $ref: "#/components/schemas/QuestionStatusTag" }
        last_score: { type: number }
        attempt_count: { type: integer }
        path: { type: array, items: { type: string }, description: 所属板块 / 章节 }
        generated_from_kp: { type: string, description: AI 出题依据的知识点名称 }
    QuestionPage:
      type: object
      required: [items, facets]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } }
        facets:
          type: object
          required: [by_qtype, by_source, exam_years]
          properties:
            by_qtype:
              type: object
              additionalProperties: { type: integer }
              description: 各题型题数
            by_source:
              type: object
              additionalProperties: { type: integer }
            exam_years: { type: array, items: { type: integer } }
        next_cursor: { type: string }
    AttemptHistory:
      type: object
      required: [attempt_id, answered_at]
      properties:
        attempt_id: { type: integer, format: int64 }
        answered_at: { type: string, format: date-time }
        score: { type: number }
        full_score: { type: number }
        is_correct: { type: boolean }
        missed_points: { type: array, items: { type: string }, description: 遗漏的采分点 }
        loss_types:
          type: array
          items: { type: string, enum: [knowledge, norm, time] }
    QuestionDetail:
      type: object
      required: [id, qtype, stem, source, origin_tags, rubric_points, rubric_version, knowledge_points, attempts, in_wrong_book, needs_review]
      properties:
        id: { type: integer, format: int64 }
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" } }
        answer: { type: string }
        answer_origin: { $ref: "#/components/schemas/Origin" }
        analysis: { type: string }
        score: { type: number }
        source: { $ref: "#/components/schemas/QuestionSource" }
        exam_year: { type: integer }
        source_ref: { $ref: "#/components/schemas/SourceRef" }
        origin_tags:
          type: array
          description: 界面标注，如 ai_generated（AI 出题）、official（官方）
          items: { type: string }
        generated_from_kp_id: { type: integer, format: int64 }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPoint" } }
        rubric_version: { type: integer }
        knowledge_points:
          type: array
          items:
            type: object
            required: [id, name, is_primary]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              is_primary: { type: boolean }
        attempts: { type: array, items: { $ref: "#/components/schemas/AttemptHistory" } }
        in_wrong_book: { type: boolean }
        needs_review: { type: boolean }
        review_reasons: { type: array, items: { $ref: "#/components/schemas/ReviewReason" } }
    QuestionInput:
      type: object
      required: [qtype, stem]
      properties:
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string, minLength: 1 }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" } }
        answer: { type: string }
        analysis: { type: string }
        score: { type: number, minimum: 0 }
        source: { type: string, enum: [exam, exercise] }
        exam_year: { type: integer }
        kp_ids: { type: array, items: { type: integer, format: int64 }, description: 第一个为主知识点 }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPointInput" } }
    QuestionPatch:
      type: object
      properties:
        qtype: { $ref: "#/components/schemas/QuestionType" }
        stem: { type: string, minLength: 1 }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" } }
        answer: { type: string }
        analysis: { type: string }
        score: { type: number, minimum: 0 }
        exam_year: { type: integer, nullable: true }
        kp_ids: { type: array, items: { type: integer, format: int64 } }
        rubric_points: { type: array, items: { $ref: "#/components/schemas/RubricPointInput" } }
        needs_review: { type: boolean }

    BankOverview:
      type: object
      required: [subject_id, bank_id, question_count, kp_count, needs_review_count, material_count, mastery_distribution, has_official]
      properties:
        subject_id: { type: integer, format: int64 }
        bank_id: { type: integer, format: int64 }
        question_count: { type: integer }
        kp_count: { type: integer }
        needs_review_count: { type: integer }
        material_count: { type: integer }
        paper_count: { type: integer }
        mastery_distribution:
          type: object
          required: [unlearned, learning, consolidating, mastered]
          properties:
            unlearned: { type: integer }
            learning: { type: integer }
            consolidating: { type: integer }
            mastered: { type: integer }
        has_official: { type: boolean, description: 已添加官方题库 }
        is_essay: { type: boolean }

    MaterialDeletionImpact:
      type: object
      required: [question_count, attempt_count, wrong_count, kp_delete_count, kp_keep_count, paper_session_count]
      properties:
        question_count: { type: integer, description: 从它识别出的题（连同作答记录和错题一起删除） }
        attempt_count: { type: integer }
        wrong_count: { type: integer }
        kp_delete_count: { type: integer, description: 只来自这份资料的知识点，删除 }
        kp_keep_count: { type: integer, description: 其他资料也有的知识点，保留 }
        paper_session_count: { type: integer, description: 用它做过的整卷，成绩保留、预估分重算 }
    TextRange:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, description: 按字符（Unicode 码点）计 }
        end: { type: integer }
    MaterialPage:
      type: object
      required: [material_id, file_name, page_no, page_count, text, highlights, low_confidence, knowledge_points]
      properties:
        material_id: { type: integer, format: int64 }
        file_name: { type: string }
        page_no: { type: integer }
        page_count: { type: integer }
        text: { type: string }
        highlights: { type: array, items: { $ref: "#/components/schemas/TextRange" } }
        low_confidence: { type: array, items: { $ref: "#/components/schemas/TextRange" } }
        knowledge_points:
          type: array
          description: 本页还识别出的知识点
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }

    SearchHit:
      type: object
      required: [text, highlights]
      properties:
        text: { type: string, description: 命中片段 }
        highlights: { type: array, items: { $ref: "#/components/schemas/TextRange" } }
    SearchResult:
      type: object
      required: [knowledge_points, questions, material_pages]
      properties:
        knowledge_points:
          type: array
          items:
            type: object
            required: [id, name, hit]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              path: { type: array, items: { type: string } }
              hit: { $ref: "#/components/schemas/SearchHit" }
        questions:
          type: array
          items:
            type: object
            required: [id, qtype, hit]
            properties:
              id: { type: integer, format: int64 }
              qtype: { $ref: "#/components/schemas/QuestionType" }
              hit: { $ref: "#/components/schemas/SearchHit" }
        material_pages:
          type: array
          items:
            type: object
            required: [material_id, file_name, page_no, hit]
            properties:
              material_id: { type: integer, format: int64 }
              file_name: { type: string }
              page_no: { type: integer }
              hit: { $ref: "#/components/schemas/SearchHit" }
