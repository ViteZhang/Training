          properties:
            question_id: { type: integer, format: int64 }
            stem: { type: string }
            answer_text: { type: string }
            grading_id: { type: integer, format: int64 }
            score: { type: number }
            full_score: { type: number }
            missing: { type: array, items: { type: string } }
