<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{siteUrl}}{{path}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="考研Training">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{siteUrl}}{{path}}">
<meta property="og:image" content="{{siteUrl}}/site-assets/logo.svg">
<meta name="theme-color" content="#231F55">
<link rel="icon" href="/site-assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site-assets/site.css">
<script type="module" src="/site-assets/site.js"></script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="/">
      <img src="/site-assets/logo.svg" width="40" height="40" alt="">
      <span>考研<span class="num">Training</span></span>
    </a>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="打开菜单">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="nav__links" id="nav-links" aria-label="主导航">
      <a href="/"{{nav.home}}>首页</a>
      <a href="/pricing"{{nav.pricing}}>会员</a>
      <a href="/help"{{nav.help}}>帮助</a>
      <a href="/about"{{nav.about}}>关于</a>
      <a class="btn btn--indigo btn--sm" href="/download"{{nav.download}}>下载 App</a>
    </nav>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="foot">
  <div class="wrap foot__in">
    <div class="foot__co">
      <strong>考研Training</strong>
      <span>© {{year}} 北京筑梦探索科技有限公司</span>
      <span class="foot__filing">{{filing}}</span>
    </div>
    <nav class="foot__links" aria-label="页脚">
      <a href="/legal/user">用户服务协议</a>
      <a href="/legal/privacy">隐私政策</a>
      <a href="/legal/membership">会员服务协议</a>
      <a href="/help#delete-account">注销账号</a>
      <a href="/help#contact">联系客服</a>
    </nav>
  </div>
</footer>
</body>
</html>
