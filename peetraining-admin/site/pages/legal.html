<!--{"title":"{{legalTitle}} · 考研Training","description":"考研Training《{{legalTitle}}》当前生效版本。","nav":""}-->
<div class="wrap wrap--text" data-legal="{{kind}}">
  <div class="page-head">
    <h1>{{legalTitle}}</h1>
    <p class="prose-meta" data-legal-meta hidden></p>
  </div>
  <article class="prose" data-legal-body style="margin-top: 24px" aria-live="polite">
    <div class="skeleton" style="width: 92%"></div>
    <div class="skeleton" style="width: 100%"></div>
    <div class="skeleton" style="width: 78%"></div>
  </article>
  <div class="panel" data-legal-fail hidden>
    <p>协议正文暂时没有加载出来。</p>
    <button class="btn btn--indigo btn--sm" type="button" style="align-self: flex-start">重新加载</button>
  </div>
  <noscript><p class="alert">本页需要开启 JavaScript 才能显示协议正文。你也可以在 App「设置 → 用户协议与隐私政策」查看。</p></noscript>
</div>
