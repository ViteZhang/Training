# 追加到 training.dreamerlab.cn 的 443 server 块内（后端仓库 deploy/nginx/training.conf）。
# 前提：dreamer-nginx 与 training-admin 都在 dreamer-net；server 块已有 resolver 127.0.0.11。
# 如果已有指向 /opt/training/admin 静态目录的 location /admin/，先删除旧配置，避免冲突。
# /api 继续由原 location / 反代到 training-api:8080，这里只接管 /admin/。

location = /admin {
    return 301 /admin/;
}

location /admin/ {
    # 用变量让 Nginx 每次请求重新解析容器地址，容器重建后无需 reload。
    set $training_admin training-admin:80;
    proxy_pass http://$training_admin;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# ── 官网 ──
# 官网和后台在同一个 training-admin 容器里。只把官网用到的路径交给它，其余路径（/api 等）仍走原来的 location /，
# 所以这一段是纯新增，不影响 API。新增官网页面时，要把页面路径加进下面的正则。
location ~ ^/(|download|pricing|help|about|legal/[a-z]+|site-assets/.+|robots\.txt)$ {
    set $training_admin training-admin:80;
    proxy_pass http://$training_admin;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
