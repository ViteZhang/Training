server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml font/ttf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /admin {
        return 301 /admin/;
    }

    # 带 hash 的静态资源长期缓存。
    location /admin/assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA 路由回落；index.html 不缓存，发布后立即生效。
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    # ── 官网（根路径）──
    # 字体长期缓存；样式和脚本文件名不带 hash，只缓存 10 分钟，发布后很快生效。
    location /site-assets/fonts/ {
        try_files $uri =404;
        expires 1y;
    }

    location /site-assets/ {
        try_files $uri =404;
        expires 10m;
    }

    # /pricing → pricing.html，/legal/privacy → legal/privacy.html；页面不缓存。
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
