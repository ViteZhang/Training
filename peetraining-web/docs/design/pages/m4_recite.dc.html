<section style="flex-grow: 1; padding: 22px 20px; border-radius: 24px; border: 1px solid #EFEFEF; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: #EEEBFB; color: #3E3190">中国古代文学 · 魏晋南北朝</span><span style="font-size: 12px; color: #6E6E6E">点空格查看</span></div>
<span style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 26px; font-weight: 700">建安风骨</h2><span style="font-size: 12px; color: #6E6E6E">原文出自 654 历年真题汇编.pdf · 2021 年参考答案</span></span>
<p style="margin: 0; font-size: 17px; line-height: 2.2">

<sc-if value="{{g.plain}}" hint-placeholder-val="{{ true }}"><span>{{g.text}}</span></sc-if>
</sc-for></p>
<div style="flex-grow: 1"></div>
<button onClick="{{showAll}}" style="align-self: flex-start; height: 38px; padding: 0 16px; border-radius: 19px; border: none; background: #F7F7F5; font-family: inherit; font-size: 13px; color: #1A1A1A; cursor: pointer">全部显示</button>

<a href="m4_recite_done.dc.html" style="height: 50px; border-radius: 25px; background: #1A1A1A; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #FFFFFF; text-decoration: none">记住了</a></div></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const shown = s.shown || {};
    const parts = [
      { b: false, t: '建安风骨，指汉末建安时期以' },
      { b: true, t: '三曹' },
      { b: false, t: '和' },
      { b: true, t: '建安七子' },
      { b: false, t: '为代表的作家，其诗文反映社会动乱与民生疾苦，抒发建功立业的抱负，形成' },
      { b: true, t: '慷慨悲凉' },
      { b: false, t: '、' },
      { b: true, t: '刚健有力' },
      { b: false, t: '的时代风格。' }
    ];
    return {
      segs: parts.map(function (p, i) {
        const open = !!shown[i];
        return {
          blank: p.b,
          plain: !p.b,
          text: p.t,
          shown: open ? p.t : '',
          bg: open ? '#EEEBFB' : '#F7F7F5',
          line: open ? '#8C80E0' : '#1A1A1A',
          reveal: function () {
            const copy = Object.assign({}, shown);
            copy[i] = true;
            self.setState({ shown: copy });
          }
        };
      }),
      showAll: function () { self.setState({ shown: { 1: true, 3: true, 5: true, 7: true } }); }
    };
  }
}
</script>
</body>
