<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.10 学科通用体验题</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
input::placeholder,textarea::placeholder{color:#9A9A96}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 44px 22px 8px; box-sizing: border-box; overflow: hidden; min-height: 0">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px"><a href="n_no_official.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: #1A1A1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size: 15px; font-weight: 500">示例题体验</span><span style="min-width: 44px; display: flex; justify-content: flex-end"><span style="font-size: 12px; color: #6E6E6E">剩 1 次</span></span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">选你的方向，挑一道试试</h1><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">示例题由团队编写，只用于体验和入门练习，不计入预估分。</p></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F7F7F5; border-radius: 14px">
<sc-for list="{{subjects}}" as="s" hint-placeholder-count="2"><button onClick="{{s.pick}}" aria-pressed="{{s.sel}}" style="height: 40px; border: none; border-radius: 10px; background: {{s.bg}}; font-family: inherit; font-size: 14px; font-weight: {{s.weight}}; color: #1A1A1A">{{s.name}}</button></sc-for>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{dirs}}" as="d" hint-placeholder-count="4"><button onClick="{{d.pick}}" aria-pressed="{{d.sel}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{d.bg}}; color: {{d.ink}}; font-family: inherit; font-size: 13px">{{d.name}}</button></sc-for>
</div>
<div style="border-radius: 20px; border: 1px solid #EFEFEF; overflow: hidden">
<sc-for list="{{qs}}" as="q" hint-placeholder-count="3"><a href="n_try_answer.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 16px; border-bottom: 1px solid #EFEFEF; text-decoration: none; color: #1A1A1A"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px">{{q.title}}</span><span style="font-size: 12px; color: #6E6E6E">{{q.meta}}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a></sc-for>
</div>

</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    
const s = this.state || {};
const subj = s.subj || 'phil';
const data = {
  phil: { name: '哲学', dirs: { ma: ['马克思主义哲学', [['实践的本质', '名词解释 · 5 分'], ['简述认识的辩证过程', '简答 · 15 分'], ['论述社会存在与社会意识的关系', '论述 · 30 分']]], cn: ['中国哲学', [['心即理', '名词解释 · 5 分'], ['简述老子的「道」', '简答 · 15 分'], ['论述王阳明的知行合一', '论述 · 30 分']]], west: ['西方哲学', [['绝对命令', '名词解释 · 5 分'], ['简述康德的「哥白尼式革命」', '简答 · 15 分'], ['论述黑格尔辩证法的主要内容', '论述 · 30 分']]], eth: ['伦理学', [['功利原则', '名词解释 · 5 分'], ['简述德性伦理学的基本主张', '简答 · 15 分'], ['论述义务论与后果主义的分歧', '论述 · 30 分']]] }, first: 'west' },
  lit: { name: '文学', dirs: { gd: ['古代文学', [['意境', '名词解释 · 5 分'], ['简述建安风骨', '简答 · 15 分'], ['论述唐诗繁荣的原因', '论述 · 30 分']]], xd: ['现当代文学', [['问题小说', '名词解释 · 5 分'], ['简述鲁迅小说的启蒙主题', '简答 · 15 分'], ['论述 1980 年代寻根文学', '论述 · 30 分']]], wg: ['外国文学', [['意识流小说', '名词解释 · 5 分'], ['简述浪漫主义文学特征', '简答 · 15 分'], ['论述《哈姆雷特》的悲剧性', '论述 · 30 分']]], ll: ['文学理论', [['陌生化', '名词解释 · 5 分'], ['简述文学典型的特征', '简答 · 15 分'], ['论述文学接受的过程', '论述 · 30 分']]] }, first: 'gd' }
};
const cur = data[subj];
const dir = (s.dir && cur.dirs[s.dir]) ? s.dir : cur.first;
return {
  subjects: ['phil', 'lit'].map((k) => ({ name: data[k].name, sel: k === subj ? 'true' : 'false', bg: k === subj ? '#FFFFFF' : 'transparent', weight: k === subj ? '700' : '400', pick: () => this.setState({ subj: k, dir: null }) })),
  dirs: Object.keys(cur.dirs).map((k) => ({ name: cur.dirs[k][0], sel: k === dir ? 'true' : 'false', bg: k === dir ? '#1A1A1A' : '#F7F7F5', ink: k === dir ? '#FFFFFF' : '#1A1A1A', pick: () => this.setState({ dir: k }) })),
  qs: cur.dirs[dir][1].map((q) => ({ title: q[0], meta: q[1] }))
};

  }
}
</script>
</body>
</html>
