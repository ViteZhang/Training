<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>6.13 意见反馈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 44px 22px 28px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px"><a href="m6_settings.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: #1A1A1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size: 15px; font-weight: 500">意见反馈</span><a href="m6_feedback.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 13px; color: #6E6E6E; text-decoration: none">历史</a></div>
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 14px; font-weight: 700">反馈类型</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px"><sc-for list="{{types}}" as="x" hint-placeholder-count="4"><button onClick="{{x.pick}}" style="height: 40px; border-radius: 20px; border: none; background: {{x.bg}}; color: {{x.fg}}; font-family: inherit; font-size: 13px; cursor: pointer">{{x.label}}</button></sc-for></div></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">详细描述</span>
<textarea placeholder="说说遇到的问题或建议，越具体越好" style="height: 150px; resize: none; padding: 14px; border-radius: 18px; border: 1px solid #E6E6E6; font-family: inherit; font-size: 15px; line-height: 1.7"></textarea></label>
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 14px; font-weight: 700">截图 <span style="font-size: 12px; font-weight: 400; color: #6E6E6E">选填，最多 3 张</span></span>
<button aria-label="添加截图" style="width: 80px; height: 80px; border-radius: 16px; border: 1.5px dashed #BDBDBD; background: #FFFFFF; color: #6E6E6E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button></div>
<div style="flex-grow: 1"></div>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.5; color: #4A4A4A"><span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #BDBDBD; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center"></span>允许客服查看相关资料排查问题（72 小时内有效，每次查看都会通知你）</label>
<span style="font-size: 12px; color: #6E6E6E">我们会通过消息中心回复你</span>
<a href="m6_settings.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">提交</a></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const t = (this.state && this.state.t) || 'grade';
    const defs = [{ id: 'idea', l: '功能建议' }, { id: 'content', l: '识别不准' }, { id: 'grade', l: '批改不准' }, { id: 'bug', l: '出现问题' }];
    return {
      types: defs.map(function (d) {
        return { label: d.l, bg: d.id === t ? '#1A1A1A' : '#F7F7F5', fg: d.id === t ? '#FFFFFF' : '#1A1A1A', pick: function () { self.setState({ t: d.id }); } };
      })
    };
  }
}
</script>
</body>
</html>
