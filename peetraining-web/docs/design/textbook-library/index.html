function renderPublish(){return adminTitle('文学理论教程',`童庆炳 · 第五版 · ${published?'已发布修订 r4':'已发布 r3 / 草稿 r4'}`,btn('编辑原文','go-editor')+btn('检索试用','go-test')+btn(published?'已发布':'发布新修订','publish-dialog',true))+tabs('publish')+`<div class="two-col"><section class="panel"><div class="row between"><h2>新修订发布检查</h2>${badge(published?'已上线':'待发布',published?'green':'orange')}</div><div class="checklist">${[['教材身份','标准书名、作者、版次与别名已填写'],['授权范围','应用内检索及相关摘录展示已登记'],['内容校对',corrected?'已完成校对':'尚未完成，点击右上角编辑原文'],['索引准备',corrected?'全文与向量索引均已就绪':'校对完成后构建新索引']].map((x,i)=>`<div class="check-row"><span class="${i<2||corrected?'check-icon':'muted'}">${i<2||corrected?'✓':'○'}</span><div><strong style="font-size:13px">${x[0]}</strong><p class="small muted">${x[1]}</p></div></div>`).join('')}</div><label class="row small" style="margin-top:20px"><input id="defaultVersion" type="checkbox" checked>作为未填写版次时的默认版本，APP 显示实际使用版次</label><div class="admin-footer"><span class="small muted">${corrected?'可发布；先检索试用再上线。':'完成校对与索引后才可发布。'}</span>${btn('去校对与构建索引','go-editor')}</div></section><section class="panel"><h2>出版版本与内容修订</h2><table class="data-table"><thead><tr><th>内容修订</th><th>状态</th><th>记录</th></tr></thead><tbody><tr><td class="num">r4</td><td>${badge(published?'已发布':'草稿',published?'green':'')}</td><td>修正目录和识别正文</td></tr><tr><td class="num">r3</td><td>${badge(published?'历史修订':'已发布',published?'':'green')}</td><td>已有答案引用保持原修订</td></tr></tbody></table><div class="notice" style="margin-top:20px">发布会切换之后生成答案的检索依据，不自动重写已有答案，也不改变历史批改。</div><div class="divider"></div><h2>关联项目</h2><p class="small muted">语言文学基础 · 官方题库<br>文学理论专题 · 官方题库</p><div class="admin-footer"><span class="small muted">下架后停止新检索，保留历史记录。</span>${btn('下架教材','unpublish-dialog')}</div></section></div>`}

function renderOps(){return adminTitle('教材库运行维护','模型、索引与内容缺口仅后台可见；APP 正常填写与使用。',btn('返回教材库','go-catalog'))+`<div class="panel"><h2>模型与检索配置状态</h2><table class="data-table"><thead><tr><th>能力</th><th>调用方式</th><th>配置状态</th><th>维护规则</th></tr></thead><tbody><tr><td>PDF 识别</td><td>视觉大模型 · 全部 PDF 页面</td><td>${badge('演示：已配置','green')}</td><td>独立任务、失败页重试</td></tr><tr><td>向量化</td><td>用户提供的嵌入模型接口</td><td>${badge('待接入接口','orange')}</td><td>记录模型版本与维度</td></tr><tr><td>全文检索</td><td>中文术语与关键词检索</td><td>${badge('方案已确定','blue')}</td><td>与向量结果合并筛选</td></tr><tr><td>答案生成</td><td>沿用现有模型服务</td><td>${badge('演示：已配置','green')}</td><td>依据限定片段组织答案</td></tr></tbody></table><div class="notice" style="margin-top:16px">此处为设计状态示例，不读取真实配置。密钥不在页面展示；向量模型或维度变更时，先重建新索引并验证，再切换使用。</div></div><div class="two-col" style="margin-top:20px"><section class="panel"><h2>书名匹配缺口 · 最近 7 天</h2><table class="data-table"><thead><tr><th>用户填写的书名（示例）</th><th>次数</th><th>处理</th></tr></thead><tbody><tr><td>童版文学理论</td><td class="num">24</td><td>${btn('维护别名','go-create')}</td></tr><tr><td>2027 中文专题讲义</td><td class="num">9</td><td>${btn('新建教材','go-create')}</td></tr></tbody></table><p class="small muted" style="margin-top:16px">仅汇总书名与计数，不展示用户身份、题干和作答。APP 不显示这些缺口或匹配失败。</p></section><section class="panel"><h2>索引维护</h2><div class="checklist"><div class="check-row"><span class="check-icon">✓</span><div><strong style="font-size:13px">已发布修订 r3</strong><p class="small muted">对外服务，独立于草稿任务</p></div></div><div class="check-row"><span>○</span><div><strong style="font-size:13px">草稿修订 r4</strong><p class="small muted">校对后构建，验证后发布</p></div></div></div><div class="admin-footer">${btn('查看识别任务','go-parse')}${btn('检索试用','go-test',true)}</div></section></div>`}
function renderAdmin(){let content=current==='catalog'?renderCatalog():current==='create'?renderCreate():current==='import'?renderImport():current==='parse'?renderParse():current==='editor'?renderEditor():current==='test'?renderTest():current==='publish'?renderPublish():current==='associate'?renderAssociate():renderOps();return adminFrame(content)}
function nav(id){if(!screens.some(x=>x[0]===id))return;current=id;location.hash=id;render()}
function render(){const s=screens.find(x=>x[0]===current);$('#rail').innerHTML=['APP','后台'].map(g=>`<div class="rail-label" ${g==='后台'?'style="margin-top:22px"':''}>${g==='APP'?'APP / 教材与答案':'ADMIN / 素材维护'}</div>${screens.filter(x=>x[1]===g).map(x=>`<button class="nav-screen" data-go="${x[0]}" aria-current="${current===x[0]?'page':'false'}"><b>${x[2]}</b><span>${x[3]}</span></button>`).join('')}`).join('')+'<div class="rail-rule"></div><div class="rail-note">APP 严格沿用现有 UI tokens。<br>未匹配静默处理。<br>PDF 大模型识别。<br>全文 + 向量检索。<br><br>画板是交互演示，无真实上传、识别或模型调用。</div>';$('#screenTitle').textContent=s[2]+' / '+s[3];$('#screenMeta').textContent=s[4];$('#note').textContent=s[5];$('#surface').innerHTML=s[1]==='APP'?renderApp():renderAdmin();$('#comment').value='';updateCount();requestAnimationFrame(fit)}
function fit(){const app=screens.find(x=>x[0]===current)[1]==='APP',w=app?414:1440,h=app?868:900,stage=$('#stage');const z=actual?1:Math.min(1,(stage.clientWidth-48)/w,(stage.clientHeight-48)/h);$('#surface').style.transform=`scale(${z})`;$('#holder').style.width=w*z+'px';$('#holder').style.height=h*z+'px';stage.style.alignItems=actual?'flex-start':'center';stage.style.justifyContent=actual?'flex-start':'center';$('#zoom').textContent=actual?'适应画布':Math.round(z*100)+'% / 原尺寸'}
function modal(title,body,action,label='确认'){const target=$('.admin');if(!target)return;target.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><section class="admin-modal" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}<div class="row" style="justify-content:flex-end;margin-top:24px">${btn('取消','close-modal')}${btn(label,action,true)}</div></section></div>`)}
function updateCount(){$('#count').textContent=comments.length;const n=comments.filter(c=>c.screen===current).length;$('#commentStatus').textContent=n?`当前画面有 ${n} 条评审意见 · 可导出 Markdown`:'意见保存在当前浏览器，可导出 Markdown。'}
function filterCatalog(){const q=$('#catalogSearch').value.trim().toLowerCase(),kind=$('#kindFilter').value,status=$('#statusFilter').value;const ds=dataBooks.filter(x=>(!q||(x[0]+x[1]).toLowerCase().includes(q))&&(kind==='全部类型'||x[2]===kind)&&(status==='全部状态'||x[4]===status));$('#catalogRows').innerHTML=ds.length?tableRows(ds):'<tr><td colspan="6"><div class="empty">没有符合筛选条件的教材</div></td></tr>';$('#resultCount').textContent=`共 ${ds.length} 项`}
document.addEventListener('input',e=>{if(e.target.id==='catalogSearch')filterCatalog();if(e.target.id==='bookInput'){const v=e.target.value.trim();$('#suggestions').innerHTML=v&&(/文学|童|教程/.test(v))?`<div class="small muted" style="margin-bottom:8px">可选建议</div><button class="app-list-row" style="padding:12px 0;border-top:1px solid var(--line)" data-act="pick-suggestion"><span class="grow">文学理论教程<div class="caption">童庆炳 · 第五版</div></span><span style="font-size:13px;color:var(--link)">选用</span></button>`:''}if(['chapterText','chapterTitle'].includes(e.target.id)){editorDirty=true;corrected=false;$('#editStatus').textContent='有未保存修改 · 保存后需重建索引'}});
document.addEventListener('change',e=>{if(['kindFilter','statusFilter'].includes(e.target.id))filterCatalog()});
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){nav(go.dataset.go);return}const rm=e.target.closest('[data-remove]');if(rm){(rm.dataset.silent==='true'?freeBooks:books).splice(+rm.dataset.remove,1);render();return}const st=e.target.closest('[data-app-state]');if(st){appState=st.dataset.appState;render();return}const tm=e.target.closest('[data-test-mode]');if(tm){testMode=tm.dataset.testMode;testRan=false;render();return}const ch=e.target.closest('[data-chapter]');if(ch){selectedChapter=+ch.dataset.chapter;render();return}const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(a.startsWith('go-')){nav(a.slice(3));return}switch(a){case'noop':break;case'save-books':if(current==='silent')books=freeBooks.slice();toast('已保存参考教材');nav('prep');break;case'pick-suggestion':$('#bookInput').value='童庆炳《文学理论教程》第五版';$('#suggestions').innerHTML='';break;case'add-book':{const v=$('#bookInput').value.trim();if(!v){toast('请填写教材名称');return}if(books.length>=5){toast('每门专业课最多填写 5 本教材');return}if(!books.includes(v))books.push(v);nav('books');toast('已添加');break}case'stage-pick':el.parentElement.querySelectorAll('button').forEach(b=>{b.style.background=b===el?'white':'transparent';b.style.fontWeight=b===el?'700':'400'});break;case'duration':el.parentElement.querySelectorAll('button').forEach(b=>{b.style.background=b===el?'var(--ink)':'var(--fill)';b.style.color=b===el?'white':'var(--ink)'});break;case'onboard-next':toast('已保存备考安排（演示）');break;case'back-answer':nav('answer');break;case'confirm-answer':el.textContent='已确认';el.disabled=true;toast('已确认，之后的批改计入预估分');break;case'edit-answer':toast('沿用现有答案与采分点编辑页');break;case'keep-answer':nav('answer');toast('已保留原答案');break;case'adopt-answer':nav('answer');toast('已采用新答案，待你核对确认');break;case'retry-answer':appState='loading';render();setTimeout(()=>nav('answer'),1100);break;case'create-next':if(!$('#bookName').value.trim()||!$('#author').value.trim()){toast('请填写书名与作者');return}if(!$('#licenseCheck').checked){toast('请先确认素材使用授权');return}nav('import');break;case'sample-file':uploadName='文学理论教程_第五版.pdf';render();break;case'start-parse':if(!uploadName){toast('请先选择示例文件');return}parsed=false;parseError=false;nav('parse');toast('已创建大模型识别任务（演示）');break;case'paste-next':if(!$('#pasteText').value.trim()){toast('请先填写正文');return}parsed=true;nav('editor');break;case'parse-complete':parsed=true;parseError=false;render();toast('演示识别完成，可进入校对');break;case'parse-fail':parseError=true;parsed=false;render();break;case'parse-retry':parseError=false;parsed=false;render();toast('已恢复失败与未完成页面（演示）');break;case'save-edit':editorDirty=false;corrected=false;$('#editStatus').textContent='草稿已保存 · 需重新构建索引';toast('草稿已保存，线上修订不变');break;case'resolve-low':toast('本处已核对，其他待核对内容继续保留');break;case'finish-edit':corrected=true;parsed=true;editorDirty=false;nav('publish');toast('演示：校对与索引已完成');break;case'run-test':if(!$('#testBook').value.trim()||!$('#testQuestion').value.trim()){toast('请填写书名和题目');return}testRan=true;$('#testResults').innerHTML=testResults();toast('演示检索完成，未调用真实模型');break;case'publish-dialog':if(published){toast('当前修订已发布');break}if(!corrected){toast('请先完成内容校对与索引构建');break}modal('发布新修订 r4？','<p class="small muted">之后生成的答案将使用新修订。已有答案和历史批改保持原来的依据。</p>','publish-confirm','确认发布');break;case'publish-confirm':published=true;render();toast('已发布新修订 r4（演示）');break;case'unpublish-dialog':modal('下架这本教材？','<p class="small muted">下架后停止新答案检索。已有答案保留生成时的依据记录；不自动删除历史数据。</p>','unpublish-confirm','确认下架');break;case'unpublish-confirm':$('#modal').remove();toast('演示已下架，停止新检索');break;case'close-modal':$('#modal').remove();break;case'associate-dialog':modal('关联已有教材','<p class="small muted" style="margin-bottom:16px">仅选择已发布的教材，关联不复制教材原文。</p><label class="row"><input type="checkbox" checked> 文学理论教程 · 童庆炳 · 第五版</label><label class="row" style="margin-top:16px"><input type="checkbox"> 中国文学批评史 · 第二版</label>','associate-confirm','保存关联');break;case'associate-confirm':$('#modal').remove();toast('已保存关联（演示）');break;case'reset-filter':$('#catalogSearch').value='';$('#kindFilter').selectedIndex=0;$('#statusFilter').selectedIndex=0;filterCatalog();break;default:toast('设计演示')}});
$('#prev').onclick=()=>nav(screens[(screens.findIndex(s=>s[0]===current)-1+screens.length)%screens.length][0]);$('#next').onclick=()=>nav(screens[(screens.findIndex(s=>s[0]===current)+1)%screens.length][0]);$('#zoom').onclick=()=>{actual=!actual;fit()};$('#saveComment').onclick=()=>{const t=$('#comment').value.trim();if(!t)return;comments.push({screen:current,title:screens.find(s=>s[0]===current)[3],text:t,time:new Date().toISOString()});try{localStorage.setItem('training-textbook-review-v1',JSON.stringify(comments))}catch{toast('浏览器存储不可用，请立即导出意见')}$('#comment').value='';updateCount();toast('评审意见已记录')};$('#export').onclick=()=>{const text='# 官方教材库 · 设计评审意见\n\n'+(comments.length?comments.map((c,i)=>`## ${i+1}. ${c.title}\n\n${c.text}\n`).join('\n'):'暂无评审意见。\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download='官方教材库_设计评审意见.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current&&screens.some(s=>s[0]===id)){current=id;render()}});if(screens.some(s=>s[0]===location.hash.slice(1)))current=location.hash.slice(1);render();
</script>
</body>
