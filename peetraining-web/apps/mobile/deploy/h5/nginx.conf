# H5 版静态站点（容器 training-h5 内的 Nginx）。只提供 /h5/ 下的网页文件，不代理接口。
# 网页文件挂载在 /usr/share/nginx/html/h5（scripts/build-h5.sh 的产物 dist-h5）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /h5 {
        return 301 /h5/;
    }

    # 文件名带内容哈希，可以长期缓存；发新版时文件名会变
    location ~ ^/h5/(_expo|assets)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 其余路径：有文件给文件，没有就回入口页（页面路由在浏览器里处理，刷新 /h5/train 这类地址才不会 404）。
    # 入口页不缓存，发版后用户下次打开就是新版。
    location = /h5/manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
    }

    location /h5/ {
        add_header Cache-Control "no-cache";
        try_files $uri /h5/index.html;
    }

    location / {
        return 404;
    }
}
