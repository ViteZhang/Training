<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.5 AI 解析中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 88px 22px 0; box-sizing: border-box; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1A1A1A"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #8A8A8A"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #CFCFCF"></span></div>
<h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">正在整理你的题库</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">预计还需 [N] 分钟。可以先离开，整理好会通知你。</p>
</div>
<div style="border-radius: 22px; border: 1px solid #EFEFEF; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 18px; border-bottom: 1px solid #EFEFEF">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">654 历年真题汇编.pdf</span><span style="font-size: 12px; color: #1F7A4D">已识别 <span style="font-family: 'DM Sans',sans-serif">128</span> 题</span></span>
<span style="width: 24px; height: 24px; border-radius: 12px; background: #E4F4EB; color: #1F7A4D; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 18px; border-bottom: 1px solid #EFEFEF">
<span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px">文学理论名词解释.docx</span><span style="font-family: 'DM Sans',sans-serif; font-size: 12px; color: #6E6E6E">58%</span></span>
<span style="display: block; height: 4px; border-radius: 2px; background: #EFEFEF"><span style="display: block; width: 58%; height: 4px; border-radius: 2px; background: #1A1A1A"></span></span>
<span style="display: flex; gap: 14px; font-size: 12px; color: #6E6E6E"><span style="color: #1A1A1A">✓ 识别文字</span><span style="color: #1A1A1A; font-weight: 500">· 拆分题目</span><span>配答案和采分点</span></span>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 18px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">拍照 · 现当代文学简答题</span><span style="font-size: 12px; color: #767676">排队中</span></span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 22px; background: #F7F7F5">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">趁这会儿，设置学习提醒</span><span style="font-size: 12px; color: #6E6E6E">每天到点提醒你完成今日计划</span></span>
<button onClick="{{toggle}}" role="switch" aria-checked="{{onStr}}" aria-label="每日学习提醒" style="width: 50px; height: 30px; padding: 0; border-radius: 15px; border: none; background: {{trackBg}}; position: relative; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{knobLeft}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></button>
</div>
<sc-if value="{{on}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px">
<sc-for list="{{times}}" as="t" hint-placeholder-count="4"><button onClick="{{t.pick}}" aria-pressed="{{t.sel}}" style="flex-grow: 1; height: 38px; border-radius: 19px; border: none; background: {{t.bg}}; color: {{t.ink}}; font-family: 'DM Sans','Noto Sans SC',sans-serif; font-size: 13px">{{t.label}}</button></sc-for>
</div></sc-if>
<span style="font-size: 12px; color: #767676">开启后会请求通知权限</span>
</div>
</main>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 22px 26px; flex-shrink: 0">
<a href="m1_confirm.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">先核对已识别的 128 题</a>
<button style="height: 44px; border: none; background: transparent; font-family: inherit; font-size: 14px; color: #6E6E6E">先进入 App，好了通知我</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const on = s.on !== false;
    const time = s.time || '20:00';
    return {
      on,
      onStr: on ? 'true' : 'false',
      trackBg: on ? '#1A1A1A' : '#CFCFCF',
      knobLeft: on ? '23px' : '3px',
      toggle: () => this.setState({ on: !on }),
      times: ['07:30', '12:30', '20:00', '自定义'].map((t) => ({
        label: t,
        sel: t === time ? 'true' : 'false',
        bg: t === time ? '#1A1A1A' : '#FFFFFF',
        ink: t === time ? '#FFFFFF' : '#1A1A1A',
        pick: () => this.setState({ time: t })
      }))
    };
  }
}
</script>
</body>
</html>
