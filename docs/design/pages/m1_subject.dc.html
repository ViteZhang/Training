<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.1 选院校和专业课</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
input::placeholder,textarea::placeholder{color:#9A9A96}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 44px 22px 8px; box-sizing: border-box; overflow: hidden; min-height: 0">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px"><div style="flex-grow: 1; display: flex; gap: 6px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span></div><span style="font-family: 'DM Sans',sans-serif; font-size: 13px; color: #6E6E6E">1 / 5</span></div><div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">你考哪所学校的哪门专业课？</h1><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">我们会先看看有没有这门课的官方题库。有就能直接刷，没有也能先体验 AI 批改。</p></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 500">参加哪一年的考试</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F7F7F5; border-radius: 14px">
<sc-for list="{{years}}" as="y" hint-placeholder-count="2"><button onClick="{{y.pick}}" aria-pressed="{{y.sel}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 52px; border: none; border-radius: 10px; background: {{y.bg}}; font-family: inherit; color: #1A1A1A"><span style="font-size: 14px; font-weight: {{y.weight}}">{{y.label}}</span><span style="font-size: 11px; color: #6E6E6E">{{y.sub}}</span></button></sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 500">目标院校</span></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1.5px solid #1A1A1A">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜索院校</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
<input type="text" value="四川大学" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #1A1A1A">
</label></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 500">专业与专业课</span><span style="font-size: 12px; color: #767676">最多 4 门</span></div>
<div style="border-radius: 20px; border: 1px solid #EFEFEF; overflow: hidden">
<sc-for list="{{courses}}" as="c" hint-placeholder-count="2"><button onClick="{{c.pick}}" aria-pressed="{{c.sel}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: none; border-bottom: 1px solid #EFEFEF; background: #FFFFFF; font-family: inherit; text-align: left; color: #1A1A1A">
<span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid {{c.ring}}; background: {{c.box}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{c.name}}</span><span style="font-size: 12px; color: #6E6E6E">{{c.major}}</span></span>
<span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: {{c.tagBg}}; color: {{c.tagInk}}; flex-shrink: 0">{{c.tag}}</span>
</button></sc-for>
<button style="width: 100%; display: flex; align-items: center; min-height: 52px; padding: 0 16px; border: none; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #6E6E6E; text-align: left">列表里没有？手动添加专业课</button>
</div></div>

</main>
<footer style="flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px 22px 26px"><a href="n_official_found.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">下一步</a><a href="n_sample.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 14px; color: #6E6E6E; text-decoration: none">院校还没定，先随便看看</a></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    
const s = this.state || {};
const year = s.year || '2027';
const picked = s.picked || { a: true };
const pill = (on) => on ? '' : '';
const list = [
  { id: 'a', name: '[专业课一名称]', major: '哲学 · 学术学位', official: true },
  { id: 'b', name: '[专业课二名称]', major: '哲学 · 学术学位', official: false }
];
return {
  years: [{ id: '2027', label: '2027 研考', sub: '今年 12 月初试' }, { id: '2028', label: '2028 研考', sub: '明年 12 月初试' }].map((y) => ({
    label: y.label, sub: y.sub, sel: y.id === year ? 'true' : 'false',
    bg: y.id === year ? '#FFFFFF' : 'transparent', weight: y.id === year ? '700' : '400',
    pick: () => this.setState({ year: y.id })
  })),
  courses: list.map((c) => {
    const on = !!picked[c.id];
    return {
      name: c.name, major: c.major, sel: on ? 'true' : 'false',
      ring: on ? '#1A1A1A' : '#BDBDBD', box: on ? '#1A1A1A' : '#FFFFFF',
      tag: c.official ? '有官方题库' : '暂无官方题库', tagBg: c.official ? '#E4F4EB' : '#F7F7F5', tagInk: c.official ? '#1F7A4D' : '#6E6E6E',
      pick: () => { const p = Object.assign({}, picked); p[c.id] = !on; this.setState({ picked: p }); }
    };
  })
};

  }
}
</script>
</body>
</html>
