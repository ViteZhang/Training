<span style="font-size: 12px; line-height: 1.6; color: #767676; text-align: center">关联由 AI 根据你资料里的章节和同题出现整理，<br>在知识点卡片里可以调整</span>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (this.state && this.state.filter) || 'all';
    return {
      filters: [{ id: 'all', label: '全部' }, { id: 'weak', label: '薄弱' }, { id: 'exam', label: '真题考过' }].map((x) => ({
        label: x.label,
        sel: x.id === f ? 'true' : 'false',
        bg: x.id === f ? '#1A1A1A' : '#F7F7F5',
        ink: x.id === f ? '#FFFFFF' : '#1A1A1A',
        pick: () => this.setState({ filter: x.id })
      }))
    };
  }
}
</script>
