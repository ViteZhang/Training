<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.6 确认导入结果</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 44px 22px 12px; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<a href="m1_parsing.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: #1A1A1A; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; display: flex; gap: 6px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span></div>
<span style="font-family: 'DM Sans',sans-serif; font-size: 13px; color: #6E6E6E">5 / 5</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">确认导入结果</h1><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">3 份文件 · 识别出 <span style="font-family: 'DM Sans',sans-serif; color: #1A1A1A">246</span> 题 · <span style="color: #B26A00"><span style="font-family: 'DM Sans',sans-serif">12</span> 处需要核对</span></p></div>
<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button onClick="{{f.pick}}" aria-pressed="{{f.sel}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; background: {{f.bg}}; color: {{f.ink}}; font-family: inherit; font-size: 13px; white-space: nowrap; flex-shrink: 0">{{f.label}} <span style="font-family: 'DM Sans',sans-serif">{{f.n}}</span></button></sc-for>
</div>
</div>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px 22px 12px; overflow-y: auto">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5"><a href="m1_confirm_item.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 18px; border: 1px solid {{it.border}}; background: {{it.bg}}; text-decoration: none; color: #1A1A1A">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: #F7F7F5">{{it.type}} · <span style="font-family: 'DM Sans',sans-serif">{{it.score}}</span> 分</span><span style="flex-grow: 1"></span><span style="font-size: 12px; font-weight: 500; color: {{it.statusInk}}">{{it.status}}</span></span>
<span style="font-size: 15px; line-height: 1.6; font-weight: 500">{{it.stem}}</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="flex-grow: 1; font-size: 12px; line-height: 1.6; color: {{it.noteInk}}">{{it.note}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
</a></sc-for>
</main>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 22px 34px; border-top: 1px solid #EFEFEF; flex-shrink: 0">
<span style="font-size: 12px; line-height: 1.6; color: #6E6E6E">需要核对的题也会入库并标出来，之后随时能改</span>
<a href="m1_done.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">确认入库 246 题</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (this.state && this.state.f) || 'all';
    const all = [
      { type: '名词解释', score: 5, stem: '意境', kind: 'subj', check: true, status: '采分点待确认', note: '4 个采分点由 AI 从参考答案中提取' },
      { type: '名词解释', score: 5, stem: '期待视野', kind: 'subj', check: true, status: '需核对', note: '识别置信度低：题干可能有错字，请对照原文' },
      { type: '论述', score: 30, stem: '试论鲁迅小说的启蒙主题', kind: 'subj', check: true, status: '缺答案', note: '原文里没有找到答案，可让 AI 生成参考答案' },
      { type: '简答', score: 15, stem: '简述意境的基本特征', kind: 'subj', check: false, status: '已确认', note: '5 个采分点 · 来自第 23 页' },
      { type: '单选', score: 2, stem: '下列作家中，属于新感觉派的是', kind: 'obj', check: false, status: '答案 C', note: '来自第 4 页' },
      { type: '单选', score: 2, stem: '索绪尔把人类的言语活动区分为', kind: 'obj', check: false, status: '答案 B', note: '来自第 5 页' }
    ];
    const pass = (x) => f === 'all' || (f === 'check' && x.check) || (f === 'subj' && x.kind === 'subj') || (f === 'obj' && x.kind === 'obj');
    return {
      filters: [
        { id: 'all', label: '全部', n: 246 },
        { id: 'check', label: '需核对', n: 12 },
        { id: 'subj', label: '主观题', n: 108 },
        { id: 'obj', label: '客观题', n: 138 }
      ].map((x) => ({
        label: x.label, n: x.n,
        sel: x.id === f ? 'true' : 'false',
        bg: x.id === f ? '#1A1A1A' : '#F7F7F5',
        ink: x.id === f ? '#FFFFFF' : '#1A1A1A',
        pick: () => this.setState({ f: x.id })
      })),
      items: all.filter(pass).map((x) => Object.assign({}, x, {
        border: x.check ? '#F3DDB3' : '#EFEFEF',
        bg: x.check ? '#FDF1DC' : '#FFFFFF',
        statusInk: x.check ? '#B26A00' : (x.kind === 'obj' ? '#1A1A1A' : '#1F7A4D'),
        noteInk: x.check ? '#6B4A12' : '#6E6E6E'
      }))
    };
  }
}
</script>
</body>
</html>
