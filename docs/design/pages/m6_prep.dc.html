<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (this.state && this.state.stage) || 'mid';
    return {
      stages: [{ id: 'base', label: '基础期' }, { id: 'mid', label: '强化期' }, { id: 'sprint', label: '冲刺期' }].map((x) => ({
        label: x.label, sel: x.id === s ? 'true' : 'false',
        bg: x.id === s ? '#FFFFFF' : 'transparent', weight: x.id === s ? '700' : '400',
        pick: () => this.setState({ stage: x.id })
      }))
    };
  }
}
